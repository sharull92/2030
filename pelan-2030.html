<style>

}
@media (prefers-color-scheme:dark){

    --paper:#0F1722; --card:#18222F; --ink:#E7ECEA; --muted:#9AA6B4; --line:#2A3646;

}
*{box-sizing:border-box}
html,body{margin:0}

<script>
// @logic-start — fungsi tulen (diuji dalam tests/calc.test.mjs)
const DEFAULTS = () => ({
  v: 4,
  updatedAt: 0,
  settings: { name: "", targetPassive: 3000, emergencyMonths: 6, notify: false, notifyDays: 3 },
  savings: 0,
  incomes: [], commitments: [], debts: [], tx: [], goals: [], ventures: [],
  cards: [], cardTx: [],
  paid: {},
  gold: { have: 0, target: 30, price: 0, by: "2028-12" },
  asb: { have: 0, s1: 15000, s1by: "2027-12" },       // dana kecemasan stage 1
  th:  { have: 0, target: 15000, by: "2030-12" }       // dana kecemasan stage 2 (Tabung Haji)
});

function normalize(d) {
  const b = DEFAULTS();
  if (!d || typeof d !== "object") return b;
  const o = Object.assign({}, b, d);
  o.settings = Object.assign({}, b.settings, d.settings || {});
  o.gold = Object.assign({}, b.gold, d.gold || {});
  o.asb = Object.assign({}, b.asb, d.asb || {});
  o.th = Object.assign({}, b.th, d.th || {});
  for (const k of ["incomes", "commitments", "debts", "tx", "goals", "ventures", "cards", "cardTx"]) {
    if (!Array.isArray(o[k])) o[k] = [];
  }
  if (!o.paid || typeof o.paid !== "object") o.paid = {};
  o.savings = Number(o.savings) || 0;
  o.v = Math.max(1, Number(o.v) || 1);
  // v1 → v2: tambah cap masa `updatedAt` untuk penyegerakan awan.
  if (o.v < 2) { o.updatedAt = Number(o.updatedAt) || 0; o.v = 2; }
  // v2 → v3: kad kredit (cards, cardTx) — tatasusunan kosong sudah diisi di atas.
  if (o.v < 3) o.v = 3;
  // v3 → v4: dana kecemasan = Stage 1 ASB + Stage 2 Tabung Haji. Medan lama asb.s2/s2by dikekalkan (tidak dipadam).
  if (o.v < 4) { if (!d.th && d.asb && d.asb.s2by) o.th.by = d.asb.s2by; o.v = 4; }
  o.updatedAt = Number(o.updatedAt) || 0;
  return o;
}

const sum = (arr, f) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);

function calc(S) {
  const income = sum(S.incomes, x => x.amount);
  const commit = sum(S.commitments, x => x.amount);
  const debtPay = sum(S.debts, x => x.payment);
  const out = commit + debtPay;
  const balance = income - out;
  const dsr = income > 0 ? (out / income) * 100 : (out > 0 ? Infinity : 0);
  const dsrLevel = dsr < 40 ? "sihat" : dsr <= 60 ? "berhati-hati" : "tinggi";
  const mix = { aktif: 0, sampingan: 0, pasif: 0 };
  for (const i of S.incomes) if (i.type in mix) mix[i.type] += Number(i.amount) || 0;
  const target = Number(S.settings.targetPassive) || 0;
  const passivePct = target > 0 ? Math.min(100, (mix.pasif / target) * 100) : 0;
  const totalDebt = sum(S.debts, x => x.balance);
  const asbT = Number(S.asb.s1) || 0, thT = Number(S.th.target) || 0;
  const asbH = Number(S.asb.have) || 0, thH = Number(S.th.have) || 0;
  const emergencyTarget = asbT + thT;
  const emergencyHave = asbH + thH;
  // Setiap stage dihadkan pada sasarannya supaya lebihan ASB tidak menutup kekurangan Tabung Haji.
  const emergencyPct = emergencyTarget > 0 ? Math.min(100, ((Math.min(asbH, asbT) + Math.min(thH, thT)) / emergencyTarget) * 100) : 0;
  const emergencyMonths = out > 0 ? (emergencyHave + (Number(S.savings) || 0)) / out : Infinity;
  return { income, commit, debtPay, out, balance, dsr, dsrLevel, mix, passivePct, totalDebt, emergencyTarget, emergencyHave, emergencyPct, emergencyMonths };
}

// Bilangan bulan untuk selesaikan hutang (faedah tahunan % dikompaun bulanan).
function monthsToPay(balance, ratePct, payment) {
  balance = Number(balance) || 0; payment = Number(payment) || 0;
  if (balance <= 0) return 0;
  if (payment <= 0) return Infinity;
  const r = (Number(ratePct) || 0) / 100 / 12;
  if (r === 0) return Math.ceil(balance / payment);
  if (payment <= balance * r) return Infinity;
  return Math.ceil(-Math.log(1 - (r * balance) / payment) / Math.log(1 + r));
}

const ym = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
const ymd = d => ym(d) + "-" + String(d.getDate()).padStart(2, "0");
const dim = (y, m) => new Date(y, m + 1, 0).getDate();

function addMonths(date, n) {
  const d = new Date(date.getFullYear(), date.getMonth() + n, 1);
  d.setDate(Math.min(date.getDate(), dim(d.getFullYear(), d.getMonth())));
  return d;
}

// Ringkasan satu kad kredit: baki, penggunaan had, belanja bulan, kategori.
function cardCalc(S, card, today) {
  const rows = S.cardTx.filter(t => t.cardId === card.id);
  const spend = sum(rows.filter(t => t.type === "belanja" || t.type === "awal"), t => t.amount);
  const paidAmt = sum(rows.filter(t => t.type === "bayar"), t => t.amount);
  const balance = Math.max(0, spend - paidAmt);
  const limit = Number(card.limit) || 0;
  const util = limit > 0 ? (balance / limit) * 100 : 0;
  const k = ym(today);
  const month = rows.filter(t => t.type === "belanja" && String(t.date).slice(0, 7) === k);
  const monthSpend = sum(month, t => t.amount);
  const byCat = {};
  for (const t of month) byCat[t.cat || "Lain-lain"] = (byCat[t.cat || "Lain-lain"] || 0) + (Number(t.amount) || 0);
  const minPay = balance > 0 ? Math.min(balance, Math.max(50, balance * 0.05)) : 0;
  const interest = balance * (Number(card.rate) || 0) / 100 / 12;
  const level = util < 30 ? "sihat" : util <= 70 ? "berhati-hati" : "tinggi";
  return { balance, limit, util, monthSpend, byCat, minPay, interest, level, available: Math.max(0, limit - balance) };
}

// Peringatan bayaran: tertunggak bulan ini + akan datang dalam `days` hari.
function upcoming(S, today, days = 14) {
  const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const items = [
    ...S.commitments.map(c => ({ id: c.id, name: c.name, amount: Number(c.amount) || 0, day: Number(c.day), kind: "komitmen" })),
    ...S.debts.filter(d => (Number(d.balance) || 0) > 0).map(d => ({ id: d.id, name: d.name, amount: Number(d.payment) || 0, day: Number(d.day), kind: "hutang" })),
    ...(S.cards || []).map(c => ({ id: c.id, name: "Kad " + c.name, amount: cardCalc(S, c, today).balance, day: Number(c.dueDay), kind: "kad" })).filter(c => c.amount > 0)
  ].filter(i => i.day >= 1 && i.day <= 31);
  const res = [];
  for (const it of items) {
    for (const off of [0, 1]) {
      const base = new Date(t0.getFullYear(), t0.getMonth() + off, 1);
      const due = new Date(base.getFullYear(), base.getMonth(), Math.min(it.day, dim(base.getFullYear(), base.getMonth())));
      const key = it.id + ":" + ym(due);
      if (S.paid[key]) continue;
      const diff = Math.round((due - t0) / 86400000);
      if ((off === 0 && diff < 0) || (diff >= 0 && diff <= days)) {
        res.push({ ...it, due: ymd(due), key, diff });
      }
    }
  }
  return res.sort((a, b) => a.diff - b.diff);
}

// Kiraan simpanan bulanan untuk capai sasaran pada "YYYY-MM".
function savCalc(have, target, by, today) {
  have = Number(have) || 0; target = Number(target) || 0;
  const need = Math.max(0, target - have);
  const pct = target > 0 ? Math.min(100, (have / target) * 100) : 0;
  let months = 0;
  if (by && /^\d{4}-\d{2}$/.test(by)) {
    const [y, m] = by.split("-").map(Number);
    months = (y - today.getFullYear()) * 12 + (m - 1 - today.getMonth()) + 1;
  }
  months = Math.max(0, months);
  const perMonth = need === 0 ? 0 : months > 0 ? need / months : Infinity;
  return { need, pct, months, perMonth };
}

// Aliran masuk/keluar ikut bulan untuk n bulan terakhir.
function trend(tx, today, n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const k = ym(addMonths(new Date(today.getFullYear(), today.getMonth(), 1), -i));
    const rows = tx.filter(t => String(t.date).slice(0, 7) === k);
    out.push({ m: k, in: sum(rows.filter(t => t.type === "in"), t => t.amount), out: sum(rows.filter(t => t.type === "out"), t => t.amount) });
  }
  return out;
}
// Dana kecemasan berperingkat: Stage 1 ASB → Stage 2 Tabung Haji.
function emergencyCalc(S, today) {
  const s1 = savCalc(S.asb.have, S.asb.s1, S.asb.s1by, today);
  const s2 = savCalc(S.th.have, S.th.target, S.th.by, today);
  const stage = s1.need > 0 ? 1 : s2.need > 0 ? 2 : 3; // 3 = kedua-dua selesai
  return { s1, s2, stage };
}

// Item bayaran berulang (komitmen, hutang aktif, kad dengan baki) untuk kalendar.
function billItems(S, today) {
  return [
    ...S.commitments.map(c => ({ id: c.id, name: c.name, amount: Number(c.amount) || 0, day: Number(c.day) })),
    ...S.debts.filter(d => (Number(d.balance) || 0) > 0).map(d => ({ id: d.id, name: d.name, amount: Number(d.payment) || 0, day: Number(d.day) })),
    ...S.cards.map(c => ({ id: c.id, name: "Kad " + c.name, amount: null, day: Number(c.dueDay) }))
  ].filter(i => i.day >= 1 && i.day <= 31);
}

// Fail kalendar iCalendar (.ics): acara bulanan berulang hingga 31 Dis 2030 dengan peringatan.
function buildICS(S, today, notifyDays = 3) {
  const escT = t => String(t).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  const d8 = d => d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
  const stamp = today.toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const n = Math.max(0, Number(notifyDays) || 0);
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Pelan 2030//MS", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:Pelan 2030 — Bayaran"];
  for (const it of billItems(S, today)) {
    const last = it.day >= 29; // 29–31 → hari terakhir bulan (tidak terlepas bulan pendek)
    let start = new Date(today.getFullYear(), today.getMonth(), Math.min(it.day, dim(today.getFullYear(), today.getMonth())));
    if (last) start = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 1);
    const title = "Bayar " + it.name + (it.amount ? " — RM" + Math.round(it.amount) : "");
    lines.push("BEGIN:VEVENT", `UID:${it.id}@pelan2030`, `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${d8(start)}`, `DTEND;VALUE=DATE:${d8(end)}`,
      `RRULE:FREQ=MONTHLY;BYMONTHDAY=${last ? -1 : it.day};UNTIL=20301231`,
      `SUMMARY:${escT(title)}`, `DESCRIPTION:${escT("Peringatan dari app Pelan 2030" + (last ? " (hari terakhir bulan)" : ""))}`, "TRANSP:TRANSPARENT");
    if (n > 0) lines.push("BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${escT(title)}`, `TRIGGER:-P${n - 1}DT15H`, "END:VALARM");
    lines.push("BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${escT(title)}`, "TRIGGER:PT9H", "END:VALARM", "END:VEVENT");
  }
  lines.push("END:VCALENDAR");
  return lines.join("\r\n") + "\r\n";
}
// @logic-end
</script>

<script>
"use strict";
const KEY = "pelan2030";
const END = new Date(2030, 11, 31);
const STAGES = ["Idea", "Validasi", "Bina", "Lancar", "Skala"];
const MIXC = { aktif: "var(--ink)", sampingan: "var(--amber)", pasif: "var(--teal)" };
const fmtRM = new Intl.NumberFormat("ms-MY", { style: "currency", currency: "MYR", maximumFractionDigits: 0 });
const RM = n => isFinite(n) ? fmtRM.format(Math.round(n)).replace("MYR", "RM") : "—";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const BULAN = ["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogo","Sep","Okt","Nov","Dis"];
const fmtYM = k => { const [y, m] = k.split("-"); return BULAN[+m - 1] + " " + y; };
const fmtD = s => { const [y, m, d] = s.split("-"); return +d + " " + BULAN[+m - 1] + " " + y; };
const today = () => new Date();

let S = load();
let tab = (() => { try { return localStorage.getItem(KEY + ":tab") || "ringkasan"; } catch { return "ringkasan"; } })();
let txMonth = ym(today());
let trendN = 6;

function load() {
  try { return normalize(JSON.parse(localStorage.getItem(KEY))); } catch { return normalize(null); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { toast("Gagal simpan — storan pelayar penuh atau disekat"); }
}
function commit() { S.updatedAt = Date.now(); save(); queuePush(); render(); syncReminders(); }

/* ---------- notifikasi tarikh bayar ---------- */
const notifySupported = () => "Notification" in window && "serviceWorker" in navigator;
// Simpan senarai bayaran akan datang dalam Cache supaya service worker boleh semak di latar belakang.
async function syncReminders(check = true) {
  if (!("caches" in window) || !("serviceWorker" in navigator)) return;
  try {
    const items = upcoming(S, today(), 45).map(u => ({ key: u.key, name: u.name, amount: u.amount, due: u.due }));
    const c = await caches.open("pelan2030-data");
    await c.put("/__peringatan.json", new Response(JSON.stringify({ on: !!S.settings.notify, days: Number(S.settings.notifyDays) || 0, items }), { headers: { "content-type": "application/json" } }));
    if (check && S.settings.notify && Notification.permission === "granted") {
      const reg = await navigator.serviceWorker.ready;
      if (reg.active) reg.active.postMessage({ type: "semak" });
    }
  } catch {}
}
async function registerPeriodic() {
  try {
    const reg = await navigator.serviceWorker.ready;
    if (!reg.periodicSync) return "tiada";
    const st = await navigator.permissions.query({ name: "periodic-background-sync" });
    if (st.state !== "granted") return "tiada";
    await reg.periodicSync.register("peringatan", { minInterval: 12 * 60 * 60 * 1000 });
    return "aktif";
  } catch { return "tiada"; }
}
async function enableNotify() {
  if (!notifySupported()) { toast("Pelayar ini tidak menyokong notifikasi"); return; }
  const perm = await Notification.requestPermission();
  if (perm !== "granted") { toast("Kebenaran ditolak — benarkan notifikasi dalam tetapan pelayar"); render(); return; }
  S.settings.notify = true; commit();
  const bg = await registerPeriodic();
  toast(bg === "aktif" ? "Notifikasi dihidupkan, termasuk semakan latar belakang" : "Notifikasi dihidupkan");
}

function downloadICS() {

const CFG = window.PELAN_CONFIG || {};
let cloudConfigured = !!(CFG.supabaseUrl && CFG.supabaseKey);
let sb = null, sbUser = null, syncMsg = "", pushT = null;
function setSync(msg) {
  syncMsg = msg;
  const el = document.getElementById("syncMsg");
  if (el) el.textContent = msg;
}
function queuePush() {
  if (!sbUser) return;
  clearTimeout(pushT);
  pushT = setTimeout(pushCloud, 1200);
}
async function pushCloud() {
  if (!sbUser) return;
  setSync("Menyegerak…");
  const { error } = await sb.from("plans").upsert({ user_id: sbUser.id, data: S, updated_at: new Date(S.updatedAt || Date.now()).toISOString() });
  setSync(error ? "Gagal segerak: " + error.message : "Disegerak " + new Date().toLocaleTimeString("ms-MY"));
}
async function pullCloud() {
  if (!sbUser) return;
  setSync("Menyemak awan…");
  const { data, error } = await sb.from("plans").select("data").eq("user_id", sbUser.id).maybeSingle();
  if (error) { setSync("Gagal baca awan: " + error.message); return; }
  const remote = data && data.data;
  if (remote && (Number(remote.updatedAt) || 0) > (S.updatedAt || 0)) {
    S = normalize(remote); save(); render();
    setSync("Data terkini dimuatkan dari awan " + new Date().toLocaleTimeString("ms-MY"));
  } else if (!remote || (S.updatedAt || 0) > (Number(remote.updatedAt) || 0)) {
    await pushCloud();
  } else {
    setSync("Sudah terkini " + new Date().toLocaleTimeString("ms-MY"));
  }
}
// Tetapan Supabase: config.js dahulu; jika kosong, ambil dari Vercel (pemboleh ubah persekitaran
// yang diisi oleh integrasi Supabase ↔ Vercel) melalui /api/supabase-config.
async function loadCloudConfig() {
  if (cloudConfigured || !location.protocol.startsWith("http")) return;
  try {
    const r = await fetch("/api/supabase-config", { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    if (j.supabaseUrl && j.supabaseKey) { CFG.supabaseUrl = j.supabaseUrl; CFG.supabaseKey = j.supabaseKey; cloudConfigured = true; }
  } catch {}
}
async function initCloud() {
  await loadCloudConfig();
  if (!cloudConfigured || !window.supabase) { if (tab === "tetapan") render(); return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);
  sb.auth.onAuthStateChange((_ev, session) => {
    const u = session ? session.user : null;
    const changed = (u && u.id) !== (sbUser && sbUser.id);
    sbUser = u;
    if (changed) { render(); if (u) setTimeout(pullCloud, 0); }
  });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && sbUser) pullCloud(); });
}
function toast(msg) {
  const el = document.createElement("div"); el.className = "toast"; el.role = "status"; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2200);
}

function chart(data) {
  const W = 320, H = 140, P = 22, max = Math.max(1, ...data.flatMap(d => [d.in, d.out]));
  const bw = (W - P) / data.length;
  const bars = data.map((d, i) => {
    const x = P + i * bw, hi = (d.in / max) * (H - 30), ho = (d.out / max) * (H - 30);
    return `<rect x="${x + bw * .12}" y="${H - 18 - hi}" width="${bw * .36}" height="${hi}" rx="2" fill="var(--teal)"><title>${fmtYM(d.m)} masuk ${RM(d.in)}</title></rect>
      <rect x="${x + bw * .52}" y="${H - 18 - ho}" width="${bw * .36}" height="${ho}" rx="2" fill="var(--red)"><title>${fmtYM(d.m)} keluar ${RM(d.out)}</title></rect>
      <text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle">${BULAN[+d.m.slice(5) - 1]}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Graf aliran tunai">
    <line x1="${P}" x2="${W}" y1="${H - 18}" y2="${H - 18}" stroke="var(--line)"/>
    <text x="0" y="12">${RM(max)}</text>${bars}</svg>
    <div class="row small muted"><span><span style="color:var(--teal)">■</span> Masuk</span><span><span style="color:var(--red)">■</span> Keluar</span></div>`;
}

function nextSteps(c) {
  const s = [];
  if (!S.incomes.length) s.push("Tambah sumber pendapatan di tab Kewangan.");
  if (!S.commitments.length && !S.debts.length) s.push("Senaraikan komitmen dan hutang anda.");
  if (c.dsr >= 40 && isFinite(c.dsr)) s.push("DSR melebihi 40% — fokus bayar hutang faedah tertinggi dahulu.");
  { const e = emergencyCalc(S, today());
    if (e.stage === 1) s.push(`Dana kecemasan stage 1: tambah ${RM(e.s1.need)} lagi dalam ASB${isFinite(e.s1.perMonth) ? ` (${RM(e.s1.perMonth)} sebulan)` : ""}.`);
    else if (e.stage === 2) s.push(`Dana kecemasan stage 2: tambah ${RM(e.s2.need)} lagi dalam Tabung Haji${isFinite(e.s2.perMonth) ? ` (${RM(e.s2.perMonth)} sebulan)` : ""}.`); }
  for (const cd of S.cards) { const k = cardCalc(S, cd, today()); if (k.util >= 30) s.push(`Kad ${cd.name} guna ${k.util.toFixed(0)}% had — cuba kurangkan bawah 30%.`); }
  if (!S.goals.length) s.push("Isi matlamat tahunan di tab Pelan 2030 (guna templat).");
  const g = S.goals.filter(x => !x.done).sort((a, b) => a.year - b.year)[0];
  if (g) s.push(`Matlamat ${g.year}: ${g.title}`);
  const v = S.ventures.find(x => x.steps.some(st => !st.done));
  if (v) s.push(`${v.name}: ${v.steps.find(st => !st.done).t}`);
  if (c.mix.pasif < (S.settings.targetPassive || 0)) s.push("Teruskan bina pendapatan pasif hingga capai sasaran.");
  return s.slice(0, 5);
}

      ${Object.keys(k.byCat).length ? `<p class="small muted" style="margin:.5rem 0 0">${Object.entries(k.byCat).sort((a, b) => b[1] - a[1]).map(([n, v]) => `${esc(n)} ${RM(v)}`).join(" · ")}</p>` : ""}
      ${k.balance > 0 ? `<form class="add" data-form="cardpay" data-id="${c.id}" style="grid-template-columns:1fr auto"><input name="amount" type="number" min="0" step="0.01" value="${k.balance.toFixed(2)}" aria-label="Jumlah bayaran"><button>Rekod bayaran kad</button></form>` : ""}
    </div>`).join("")}
    ${totUtil >= 30 ? `<p class="small muted">Tip: kekalkan penggunaan bawah 30% had dan bayar penuh setiap bulan untuk elak caj faedah.</p>` : ""}` : `<p class="empty">Belum ada kad. Tambah kad di bawah.</p>`}
    <details style="margin-top:12px"><summary>Tambah kad</summary>
    <form class="add" data-form="card">
      <label>Nama kad<input name="name" required placeholder="cth. Maybank Visa"></label>

    <form class="add" data-form="cardtx">
      <label>Kad<select name="cardId">${S.cards.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></label>

function vNotify() {
  const perm = notifySupported() ? Notification.permission : "tiada";
  const on = S.settings.notify && perm === "granted";
  const n = Number(S.settings.notifyDays) || 0;
  let status;
  if (perm === "tiada") status = `<p class="small muted">Pelayar ini tidak menyokong notifikasi. Guna kalendar di bawah. Di iPhone, pasang app ke Skrin Utama dahulu (iOS 16.4+).</p>`;
  else if (perm === "denied") status = `<p class="small neg">Notifikasi disekat. Buka tetapan pelayar/app → Notifikasi → benarkan untuk laman ini.</p>`;
  else if (on) status = `<p class="small"><span class="pill ok">Hidup</span> Anda dimaklumkan ${n ? n + " hari sebelum" : "pada hari"} tarikh bayar, dan setiap hari jika lewat.</p>
    <div class="row"><button class="sm" data-act="testnotify">Uji notifikasi</button><button class="sm" data-act="notifyoff">Matikan</button></div>`;
  else status = `<button class="primary" data-act="notifyon">Hidupkan notifikasi</button>`;
  return `<section class="card">
    <h2>Notifikasi tarikh bayar</h2>
    <label style="max-width:240px">Ingatkan saya<select data-act="notifydays">${[0, 1, 2, 3, 5, 7].map(d => `<option value="${d}" ${d === n ? "selected" : ""}>${d ? d + " hari sebelum" : "Pada hari bayar"}</option>`).join("")}</select></label>
    <div style="margin-top:10px">${status}</div>
    <p class="small muted">Notifikasi app disemak setiap kali app dibuka, dan secara berkala di latar belakang jika app dipasang (Chrome Android). Buka app sekurang-kurangnya sebulan sekali.</p>
    <h3 style="margin-top:14px">Peringatan kalendar (paling pasti)</h3>
    <p class="small muted">Muat turun dan buka fail ini — setiap komitmen, hutang dan kad ditambah ke kalendar telefon sebagai acara bulanan hingga 2030, dengan peringatan pukul 9 pagi. Muat turun semula jika anda menambah bayaran baru (acara sedia ada dikemas kini, tidak berganda).</p>

  </section>`;
}

/* ---------- peristiwa ---------- */
const num = v => Number(v) || 0;
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f));
  if (f.dataset.form === "login") {
    const btn = f.querySelector("button"); btn.disabled = true;
    sb.auth.signInWithOtp({ email: d.email.trim(), options: { emailRedirectTo: location.origin + location.pathname } })
      .then(({ error }) => toast(error ? "Gagal: " + error.message : "Semak e-mel anda untuk pautan log masuk"))
      .finally(() => { btn.disabled = false; });
    return;
  }
  switch (f.dataset.form) {
    case "income": S.incomes.push({ id: uid(), name: d.name.trim(), type: d.type, amount: num(d.amount) }); break;
    case "tx": S.tx.push({ id: uid(), date: d.date, type: d.type, cat: d.cat.trim(), amount: num(d.amount), note: d.note.trim() }); txMonth = d.date.slice(0, 7); break;
    case "gold": Object.assign(S.gold, { have: num(d.have), target: num(d.target), price: num(d.price), by: d.by || S.gold.by }); toast("Disimpan"); break;
    case "emergency":
      Object.assign(S.asb, { have: num(d.asbHave), s1: num(d.s1), s1by: d.s1by || S.asb.s1by });
      Object.assign(S.th, { have: num(d.thHave), target: num(d.thTarget), by: d.thBy || S.th.by });
      S.savings = num(d.savings); toast("Disimpan"); break;
    case "commitment": S.commitments.push({ id: uid(), name: d.name.trim(), amount: num(d.amount), day: num(d.day) }); break;
    case "debt": S.debts.push({ id: uid(), name: d.name.trim(), balance: num(d.balance), rate: num(d.rate), payment: num(d.payment), day: num(d.day) }); break;
    case "goal": S.goals.push({ id: uid(), year: num(d.year), area: d.area, title: d.title.trim(), done: false }); break;
    case "venture": S.ventures.push({ id: uid(), name: d.name.trim(), kind: d.kind.trim() || "Projek", target: num(d.target), stage: 0, steps: VENTURE_STEPS.map(t => ({ t, done: false })) }); break;
    case "step": { const v = S.ventures.find(x => x.id === f.dataset.id); if (v) v.steps.push({ t: d.t.trim(), done: false }); break; }
    case "card": {
      const card = { id: uid(), name: d.name.trim(), limit: num(d.limit), dueDay: num(d.dueDay), rate: num(d.rate) };
      S.cards.push(card);
      if (num(d.opening) > 0) S.cardTx.push({ id: uid(), cardId: card.id, date: ymd(today()), type: "awal", amount: num(d.opening), cat: "Baki awal", note: "" });
      break;
    }
    case "cardtx": S.cardTx.push({ id: uid(), cardId: d.cardId, date: d.date, type: "belanja", amount: num(d.amount), cat: d.cat.trim(), note: d.note.trim() }); cardMonth = d.date.slice(0, 7); toast("Belanja kad direkod"); break;
    case "cardpay": {
      const card = S.cards.find(x => x.id === f.dataset.id); const amt = num(d.amount);
      if (card && amt > 0) {
        S.cardTx.push({ id: uid(), cardId: card.id, date: ymd(today()), type: "bayar", amount: amt, cat: "Bayaran", note: "" });
        S.tx.push({ id: uid(), date: ymd(today()), type: "out", cat: "Kad kredit", amount: amt, note: "Bayar " + card.name });
        toast("Bayaran kad direkod");
      }
      break;
    }
    case "settings": Object.assign(S.settings, { name: d.name.trim(), targetPassive: num(d.targetPassive), }); toast("Disimpan"); break;
  }
  commit();
});

document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]");
  if (tb) { tab = tb.dataset.tab; try { localStorage.setItem(KEY + ":tab", tab); } catch {} render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const { act, id } = b.dataset;
  switch (act) {
    case "del": if (confirm(b.dataset.list === "cards" ? "Padam kad ini dan semua rekod penggunaannya?" : "Padam item ini?")) {
      S[b.dataset.list] = S[b.dataset.list].filter(x => x.id !== id);
      if (b.dataset.list === "cards") S.cardTx = S.cardTx.filter(x => x.cardId !== id);
      commit();
    } break;
    case "pay": {
      S.paid[b.dataset.key] = true;
      const amt = num(b.dataset.amt);
      const kind = b.dataset.kind;
      S.tx.push({ id: uid(), date: ymd(today()), type: "out", cat: kind === "hutang" ? "Hutang" : kind === "kad" ? "Kad kredit" : "Komitmen", amount: amt, note: b.dataset.name, link: b.dataset.key });
      if (kind === "kad") S.cardTx.push({ id: uid(), cardId: id, date: ymd(today()), type: "bayar", amount: amt, cat: "Bayaran", note: "" });
      if (b.dataset.kind === "hutang") { const d = S.debts.find(x => x.id === id); if (d) d.balance = Math.max(0, num(d.balance) - amt); }
      toast("Direkod sebagai transaksi"); commit(); break;
    }
    case "trend": trendN = num(b.dataset.n); render(); break;
    case "goaltpl": {
      const have = new Set(S.goals.map(g => g.title));
      GOAL_TPL.forEach(([year, area, title]) => { if (!have.has(title)) S.goals.push({ id: uid(), year, area, title, done: false }); });
      toast("Templat ditambah"); commit(); break;
    }
    case "venturetpl": { const [name, kind, target] = VENTURE_TPL[num(b.dataset.i)]; S.ventures.push({ id: uid(), name, kind, target, stage: 0, steps: VENTURE_STEPS.map(t => ({ t, done: false })) }); commit(); break; }
    case "stage": { const v = S.ventures.find(x => x.id === id); if (v) { v.stage = Math.max(0, Math.min(4, v.stage + num(b.dataset.d))); commit(); } break; }
    case "delstep": { const v = S.ventures.find(x => x.id === id); if (v) { v.steps.splice(num(b.dataset.i), 1); commit(); } break; }
    case "backup": {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `pelan2030-sandaran-${ymd(today())}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); break;
    }
    case "restore": document.getElementById("restoreFile").click(); break;
    case "sync": pullCloud(); break;
    case "notifyon": enableNotify(); break;
    case "notifyoff": S.settings.notify = false; commit(); toast("Notifikasi dimatikan"); break;
    case "testnotify": testNotify(); break;
    case "ics": downloadICS(); break;
    case "install": if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); } break;
    case "logout": sb.auth.signOut().then(() => { sbUser = null; setSync(""); render(); toast("Telah log keluar. Data kekal dalam peranti ini."); }); break;
    case "wipe": if (confirm(sbUser ? "Padam SEMUA data, termasuk salinan di awan? Tindakan ini tidak boleh diundur." : "Padam SEMUA data? Tindakan ini tidak boleh diundur.") && confirm("Pasti? Muat turun sandaran dahulu jika perlu.")) { S = normalize(null); commit(); toast("Semua data dipadam"); } break;
  }
});

document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "restoreFile" && el.files[0]) {
    el.files[0].text().then(txt => {
      const d = JSON.parse(txt);
      if (!confirm("Ganti data semasa dengan sandaran ini?")) return;
      S = normalize(d); commit(); toast("Sandaran dipulihkan");
    }).catch(() => toast("Fail sandaran tidak sah")).finally(() => { el.value = ""; });
    return;
  }
  const act = el.dataset.act; if (!act) return;
  if (act === "txmonth" && el.value) { txMonth = el.value; render(); }
  if (act === "cardmonth" && el.value) { cardMonth = el.value; render(); }
  if (act === "notifydays") { S.settings.notifyDays = num(el.value); commit(); }
  if (act === "cardfilter") { cardFilter = el.value; render(); }
  if (act === "goaldone") { const g = S.goals.find(x => x.id === el.dataset.id); if (g) { g.done = el.checked; commit(); } }
  if (act === "step") { const v = S.ventures.find(x => x.id === el.dataset.id); if (v) { v.steps[num(el.dataset.i)].done = el.checked; commit(); } }
  if (act === "debtbal") { const d = S.debts.find(x => x.id === el.dataset.id); if (d) { d.balance = num(el.value); commit(); } }
});

window.addEventListener("storage", e => { if (e.key === KEY) { S = load(); render(); } });
render();
initCloud();
syncReminders();
if (S.settings.notify) registerPeriodic();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
