<style>
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --sunken:#ECEBE4; --ink:#16211D; --muted:#56645E; --line:#D9DCD3; --line-strong:#848F89;
  --primary:#0B6B57; --on-primary:#FFFFFF; --primary-soft:#D5ECE4; --accent:#F0B23E; --on-accent:#2A1D00;
  --pos:#0B6B57; --warn:#8A5600; --warn-soft:#FBECC9; --neg:#AB3326; --neg-soft:#F8DCD7; --focus:#0B6B57;
  --scrim:rgba(8,14,12,.5);
  --shadow-card:0 1px 2px rgba(22,33,29,.05),0 2px 8px rgba(22,33,29,.04); --shadow-raised:0 8px 24px rgba(22,33,29,.16);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1412; --surface:#17201D; --sunken:#1F2A26; --ink:#EDF2EF; --muted:#A3B3AD; --line:#2C3834; --line-strong:#66756F;
    --primary:#5CC9AA; --on-primary:#06231B; --primary-soft:#163A31; --accent:#F3BD5A; --on-accent:#2A1D00;
    --pos:#5CC9AA; --warn:#F3BD5A; --warn-soft:#3A2E12; --neg:#F28A78; --neg-soft:#3D1F1A; --focus:#F3BD5A;
    --scrim:rgba(0,0,0,.6); --shadow-card:none; --shadow-raised:0 8px 24px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#17201D; --sunken:#1F2A26; --ink:#EDF2EF; --muted:#A3B3AD; --line:#2C3834; --line-strong:#66756F;
  --primary:#5CC9AA; --on-primary:#06231B; --primary-soft:#163A31; --accent:#F3BD5A; --on-accent:#2A1D00;
  --pos:#5CC9AA; --warn:#F3BD5A; --warn-soft:#3A2E12; --neg:#F28A78; --neg-soft:#3D1F1A; --focus:#F3BD5A;
  --scrim:rgba(0,0,0,.6); --shadow-card:none; --shadow-raised:0 8px 24px rgba(0,0,0,.5); color-scheme:dark;
}
/* nama lama yang masih dipakai oleh skrip (graf, campuran pendapatan) */
:root{--paper:var(--bg);--card:var(--surface);--red:var(--neg);--teal:var(--pos);--amber:var(--accent);--gold:var(--accent);--ok:var(--pos);--bad:var(--neg)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:inherit;margin:0 0 .5rem;letter-spacing:-.01em}
h1{font-size:28px;line-height:34px;font-weight:800} h2{font-size:20px;line-height:26px;font-weight:700} h3{font-size:17px;line-height:24px;font-weight:700}
main{max-width:480px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 96px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;margin:0 0 16px;box-shadow:var(--shadow-card)}
.muted{color:var(--muted)}
.num.muted{color:var(--muted)} .small{font-size:14px;line-height:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--sunken);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:22px;line-height:28px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.stat span{font-size:14px;font-weight:600;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)}

.pill.ok{background:var(--primary-soft);color:var(--pos)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--neg-soft);color:var(--neg)}
.pill.ok::before,.pill.warn::before,.pill.bad::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.bar{height:12px;background:var(--sunken);border-radius:999px;overflow:hidden}

ul.list{list-style:none;margin:0;padding:0}

label{display:grid;gap:8px;font-size:14px;line-height:20px;font-weight:600;color:var(--ink)}
input,select,textarea{font:inherit;font-size:16px;font-weight:400;color:var(--ink);background:var(--surface);border:1.5px solid var(--line-strong);border-radius:12px;padding:0 14px;min-height:52px;width:100%;min-width:0}

.toast.undo button{background:transparent;box-shadow:none;color:var(--bg);text-decoration:underline;min-height:48px;padding:0 12px}
.toast{position:fixed;left:16px;right:16px;max-width:448px;margin:0 auto;bottom:calc(80px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);min-height:52px;display:flex;align-items:center;padding:0 16px;border-radius:12px;font-size:15px;font-weight:500;box-shadow:var(--shadow-raised);z-index:20}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .4s ease}}

#fab b{font-size:26px;line-height:1;font-weight:500}

#sheet[hidden]{display:none}
#sheet .panel{background:var(--surface);color:var(--ink);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;box-shadow:var(--shadow-raised)}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line-strong);margin:8px auto 16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sunken);padding:4px;border-radius:16px}
.seg button{border:0;box-shadow:none;background:transparent;min-height:44px;border-radius:12px;color:var(--muted)}

.amt{font-size:40px;font-weight:800;line-height:48px;text-align:center;border:0;border-bottom:2px solid var(--line);border-radius:0;background:transparent;padding:12px 4px;margin:12px 0;min-height:72px;font-variant-numeric:tabular-nums}

.chips{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:8px;margin:8px -20px 12px;padding:4px 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border-radius:999px;min-height:40px;padding:0 16px;font-size:14px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary);box-shadow:inset 0 0 0 1.5px var(--primary)}
.lagi a,.lagi button{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;text-align:left;box-shadow:none;background:transparent;border-radius:0;padding:0;border-top:1px solid var(--line)}
.lagi button:first-of-type{border-top:0}
.lagi button i{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;background:var(--sunken);color:var(--ink);flex:none}
.lagi button svg{width:22px;height:22px}
.lagi button span{flex:1;min-width:0}
.lagi button span[aria-hidden]{flex:none;font-size:24px;color:var(--muted)}

@media print{#fab,#sheet{display:none!important}}
@media print{
  @page{size:A4;margin:14mm 12mm}
  html,body{background:#fff!important;padding:0!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;color:#17263A;font:10.5pt/1.45 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rp header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #0B6B57;padding-bottom:8px;margin-bottom:12px}
  .rp h1{font:700 18pt "Plus Jakarta Sans",sans-serif;margin:0;color:#0B6B57}
  .rp .sub{font-size:11pt;color:#5A6676}
  .rp .brand{font:700 10pt "Plus Jakarta Sans",sans-serif;color:#0B6B57;border:2px dashed #0B6B57;border-radius:6px;padding:3px 8px;transform:rotate(-3deg)}
  .rp h2{font:700 12pt "Plus Jakarta Sans",sans-serif;margin:16px 0 6px;color:#17263A;break-after:avoid}
  .rp .kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .rp .kpi div{border:1px solid #D3DAD5;border-radius:8px;padding:8px 10px;background:#F4F7F5}
  .rp .kpi span{display:block;font-size:8.5pt;color:#5A6676}
  .rp .kpi b{font:700 13pt "Plus Jakarta Sans",sans-serif}

  .rp table{width:100%;border-collapse:collapse;font-size:9.5pt}
  .rp th{text-align:left;font-weight:600;color:#5A6676;border-bottom:1.5px solid #17263A;padding:4px 6px}

  .rp .r{text-align:right;white-space:nowrap}
  .rp .pos,.rp .ok{color:#0B6B57}.rp .neg,.rp .bad{color:#AB3326}
  .rp .ok,.rp .bad{font-weight:600}

  .rp .bar{height:4px;background:#E2E7E4;border:0;border-radius:2px;margin-top:3px;max-width:60%}

</style>

<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs" aria-label="Navigasi utama" id="nav"></nav>
<button id="fab" type="button" aria-label="Rekod transaksi baru" data-act="quick"><b aria-hidden="true">＋</b>Rekod</button>
<div id="sheet" hidden></div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>

<script>
// @logic-start — fungsi tulen (diuji dalam tests/calc.test.mjs)
const DEFAULTS = () => ({
  v: 7,
  updatedAt: 0,
  settings: { name: "", targetPassive: 3000, emergencyMonths: 6, notify: false, notifyDays: 3 },
  savings: 0,
  incomes: [], commitments: [], debts: [], tx: [], goals: [], ventures: [],
  cards: [], cardTx: [],
  budgets: [],  // v7: bajet bulanan berulang { id, cat, amount }
  deposits: [], // v6: rekod simpanan { id, kind: "emas"|"asb"|"th", dir: "in"|"out", date, amount (RM), grams?, note }
  trash: {},   // v5: item dipadam { id: { list, item, at, cardTx?, ventureId?, index? } } — disimpan 30 hari
  paid: {},
  gold: { have: 0, target: 30, price: 0, by: "2028-12" },
  asb: { have: 0, s1: 15000, s1by: "2027-12" },       // dana kecemasan stage 1
  th:  { have: 0, target: 15000, by: "2030-12" }       // dana kecemasan stage 2 (Tabung Haji)
});

function normalize(d) {
  const b = DEFAULTS();
  if (!d || typeof d !== "object") return b;
  const o = Object.assign({}, b, d);
  o.settings = Object.assign({}, b.settings, d.settings || {});
  o.gold = Object.assign({}, b.gold, d.gold || {});
  o.asb = Object.assign({}, b.asb, d.asb || {});
  o.th = Object.assign({}, b.th, d.th || {});
  for (const k of ["incomes", "commitments", "debts", "tx", "goals", "ventures", "cards", "cardTx", "deposits", "budgets"]) {
    if (!Array.isArray(o[k])) o[k] = [];
  }
  if (!o.paid || typeof o.paid !== "object") o.paid = {};
  o.savings = Number(o.savings) || 0;
  o.v = Math.max(1, Number(o.v) || 1);
  // v1 → v2: tambah cap masa `updatedAt` untuk penyegerakan awan.
  if (o.v < 2) { o.updatedAt = Number(o.updatedAt) || 0; o.v = 2; }
  // v2 → v3: kad kredit (cards, cardTx) — tatasusunan kosong sudah diisi di atas.
  if (o.v < 3) o.v = 3;
  // v3 → v4: dana kecemasan = Stage 1 ASB + Stage 2 Tabung Haji. Medan lama asb.s2/s2by dikekalkan (tidak dipadam).
  if (o.v < 4) { if (!d.th && d.asb && d.asb.s2by) o.th.by = d.asb.s2by; o.v = 4; }
  // v4 → v5: tong sampah
  if (!o.trash || typeof o.trash !== "object" || Array.isArray(o.trash)) o.trash = {};
  if (o.v < 5) o.v = 5;
  // v5 → v6: rekod simpanan. Baki sedia ada (gold/asb/th .have) kekal sebagai "baki awal".
  if (o.v < 6) o.v = 6;
  // v6 → v7: bajet bulanan ikut kategori
  if (o.v < 7) o.v = 7;
  o.updatedAt = Number(o.updatedAt) || 0;
  return o;
}

const sum = (arr, f) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);

function calc(S) {
  const income = sum(S.incomes, x => x.amount);
  const commit = sum(S.commitments, x => x.amount);
  const debtPay = sum(S.debts, x => x.payment);
  const out = commit + debtPay;
  const balance = income - out;
  const dsr = income > 0 ? (out / income) * 100 : (out > 0 ? Infinity : 0);
  const dsrLevel = dsr < 40 ? "sihat" : dsr <= 60 ? "berhati-hati" : "tinggi";
  const mix = { aktif: 0, sampingan: 0, pasif: 0 };
  for (const i of S.incomes) if (i.type in mix) mix[i.type] += Number(i.amount) || 0;
  const target = Number(S.settings.targetPassive) || 0;
  const passivePct = target > 0 ? Math.min(100, (mix.pasif / target) * 100) : 0;
  const totalDebt = sum(S.debts, x => x.balance);
  const asbT = Number(S.asb.s1) || 0, thT = Number(S.th.target) || 0;
  const asbH = asbHave(S), thH = thHave(S);
  const emergencyTarget = asbT + thT;
  const emergencyHave = asbH + thH;
  // Setiap stage dihadkan pada sasarannya supaya lebihan ASB tidak menutup kekurangan Tabung Haji.
  const emergencyPct = emergencyTarget > 0 ? Math.min(100, ((Math.min(asbH, asbT) + Math.min(thH, thT)) / emergencyTarget) * 100) : 0;
  const emergencyMonths = out > 0 ? (emergencyHave + (Number(S.savings) || 0)) / out : Infinity;
  return { income, commit, debtPay, out, balance, dsr, dsrLevel, mix, passivePct, totalDebt, emergencyTarget, emergencyHave, emergencyPct, emergencyMonths };
}

// Bilangan bulan untuk selesaikan hutang (faedah tahunan % dikompaun bulanan).
function monthsToPay(balance, ratePct, payment) {
  balance = Number(balance) || 0; payment = Number(payment) || 0;
  if (balance <= 0) return 0;
  if (payment <= 0) return Infinity;
  const r = (Number(ratePct) || 0) / 100 / 12;
  if (r === 0) return Math.ceil(balance / payment);
  if (payment <= balance * r) return Infinity;
  return Math.ceil(-Math.log(1 - (r * balance) / payment) / Math.log(1 + r));
}

const ym = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
const ymd = d => ym(d) + "-" + String(d.getDate()).padStart(2, "0");
const dim = (y, m) => new Date(y, m + 1, 0).getDate();

function addMonths(date, n) {
  const d = new Date(date.getFullYear(), date.getMonth() + n, 1);
  d.setDate(Math.min(date.getDate(), dim(d.getFullYear(), d.getMonth())));
  return d;
}

// Ringkasan satu kad kredit: baki, penggunaan had, belanja bulan, kategori.
function cardCalc(S, card, today) {
  const rows = S.cardTx.filter(t => t.cardId === card.id);
  const spend = sum(rows.filter(t => t.type === "belanja" || t.type === "awal"), t => t.amount);
  const paidAmt = sum(rows.filter(t => t.type === "bayar"), t => t.amount);
  const balance = Math.max(0, spend - paidAmt);
  const limit = Number(card.limit) || 0;
  const util = limit > 0 ? (balance / limit) * 100 : 0;
  const k = ym(today);
  const month = rows.filter(t => t.type === "belanja" && String(t.date).slice(0, 7) === k);
  const monthSpend = sum(month, t => t.amount);
  const byCat = {};
  for (const t of month) byCat[t.cat || "Lain-lain"] = (byCat[t.cat || "Lain-lain"] || 0) + (Number(t.amount) || 0);
  const minPay = balance > 0 ? Math.min(balance, Math.max(50, balance * 0.05)) : 0;
  const interest = balance * (Number(card.rate) || 0) / 100 / 12;
  const level = util < 30 ? "sihat" : util <= 70 ? "berhati-hati" : "tinggi";
  return { balance, limit, util, monthSpend, byCat, minPay, interest, level, available: Math.max(0, limit - balance) };
}

// Peringatan bayaran: tertunggak bulan ini + akan datang dalam `days` hari.
function upcoming(S, today, days = 14) {
  const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const items = [
    ...S.commitments.map(c => ({ id: c.id, name: c.name, amount: Number(c.amount) || 0, day: Number(c.day), kind: "komitmen" })),
    ...S.debts.filter(d => (Number(d.balance) || 0) > 0).map(d => ({ id: d.id, name: d.name, amount: Number(d.payment) || 0, day: Number(d.day), kind: "hutang" })),
    ...(S.cards || []).map(c => ({ id: c.id, name: "Kad " + c.name, amount: cardCalc(S, c, today).balance, day: Number(c.dueDay), kind: "kad" })).filter(c => c.amount > 0)
  ].filter(i => i.day >= 1 && i.day <= 31);
  const res = [];
  for (const it of items) {
    for (const off of [0, 1]) {
      const base = new Date(t0.getFullYear(), t0.getMonth() + off, 1);
      const due = new Date(base.getFullYear(), base.getMonth(), Math.min(it.day, dim(base.getFullYear(), base.getMonth())));
      const key = it.id + ":" + ym(due);
      if (S.paid[key]) continue;
      const diff = Math.round((due - t0) / 86400000);
      if ((off === 0 && diff < 0) || (diff >= 0 && diff <= days)) {
        res.push({ ...it, due: ymd(due), key, diff });
      }
    }
  }
  return res.sort((a, b) => a.diff - b.diff);
}

// Kiraan simpanan bulanan untuk capai sasaran pada "YYYY-MM".
function savCalc(have, target, by, today) {
  have = Number(have) || 0; target = Number(target) || 0;
  const need = Math.max(0, target - have);
  const pct = target > 0 ? Math.min(100, (have / target) * 100) : 0;
  let months = 0;
  if (by && /^\d{4}-\d{2}$/.test(by)) {
    const [y, m] = by.split("-").map(Number);
    months = (y - today.getFullYear()) * 12 + (m - 1 - today.getMonth()) + 1;
  }
  months = Math.max(0, months);
  const perMonth = need === 0 ? 0 : months > 0 ? need / months : Infinity;
  return { need, pct, months, perMonth };
}

// Aliran masuk/keluar ikut bulan untuk n bulan terakhir.
function trend(tx, today, n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const k = ym(addMonths(new Date(today.getFullYear(), today.getMonth(), 1), -i));
    const rows = tx.filter(t => String(t.date).slice(0, 7) === k);
    out.push({ m: k, in: sum(rows.filter(t => t.type === "in"), t => t.amount), out: sum(rows.filter(t => t.type === "out"), t => t.amount) });
  }
  return out;
}
// Simpanan = baki awal + semua rekod simpanan (dir "out" = jual / keluarkan).
function depTotal(S, kind) {
  return sum(S.deposits.filter(d => d.kind === kind), d => (d.dir === "out" ? -1 : 1) * (Number(kind === "emas" ? d.grams : d.amount) || 0));
}
const goldHave = S => Math.round(((Number(S.gold.have) || 0) + depTotal(S, "emas")) * 1000) / 1000;
const asbHave = S => Math.round(((Number(S.asb.have) || 0) + depTotal(S, "asb")) * 100) / 100;
const thHave = S => Math.round(((Number(S.th.have) || 0) + depTotal(S, "th")) * 100) / 100;
const goldCost = S => sum(S.deposits.filter(d => d.kind === "emas" && d.dir !== "out"), d => d.amount);

// Dana kecemasan berperingkat: Stage 1 ASB → Stage 2 Tabung Haji.
function emergencyCalc(S, today) {
  const s1 = savCalc(asbHave(S), S.asb.s1, S.asb.s1by, today);
  const s2 = savCalc(thHave(S), S.th.target, S.th.by, today);
  const stage = s1.need > 0 ? 1 : s2.need > 0 ? 2 : 3; // 3 = kedua-dua selesai
  return { s1, s2, stage };
}

// Semua duit keluar bulan ini: transaksi keluar (kecuali bayaran bil kad — belanja kad sudah dikira)
// + belanja kad kredit; serta komitmen/hutang bulan ini yang belum ditanda "Dah bayar".
function monthOut(S, today) {
  const k = ym(today);
  const inMonth = t => String(t.date).slice(0, 7) === k;
  const txOut = S.tx.filter(t => t.type === "out" && inMonth(t) && t.cat !== "Kad kredit");
  const cardSpend = S.cardTx.filter(t => t.type === "belanja" && inMonth(t));
  const byCat = {};
  for (const t of [...txOut, ...cardSpend]) { const c = String(t.cat || "Lain-lain").trim() || "Lain-lain"; byCat[c] = (byCat[c] || 0) + (Number(t.amount) || 0); }
  const pendingItems = [
    ...S.commitments.map(c => ({ id: c.id, amount: Number(c.amount) || 0 })),
    ...S.debts.filter(d => (Number(d.balance) || 0) > 0).map(d => ({ id: d.id, amount: Number(d.payment) || 0 }))
  ].filter(i => !S.paid[i.id + ":" + k]);
  const spent = sum(txOut, t => t.amount) + sum(cardSpend, t => t.amount);
  const pending = sum(pendingItems, i => i.amount);
  const received = sum(S.tx.filter(t => t.type === "in" && inMonth(t)), t => t.amount);
  return { spent, pending, total: spent + pending, received, byCat, cardSpend: sum(cardSpend, t => t.amount) };
}

// Ringkasan setahun (year = 0 → semua tahun). Pendapatan = transaksi "Masuk" sebenar sahaja.
// Jika bulan semasa belum ada "Masuk", pendapatan dirancang ditunjuk sebagai "dijangka" (tidak dicampur).
function yearSummary(S, year, today) {
  const Y = String(year), curYM = ym(today);
  const all = !Number(year);
  const inY = t => all || String(t.date).slice(0, 4) === Y;
  const txOut = S.tx.filter(t => t.type === "out" && inY(t) && t.cat !== "Kad kredit");
  const cardSpend = S.cardTx.filter(t => t.type === "belanja" && inY(t));
  const txIn = S.tx.filter(t => t.type === "in" && inY(t));
  const byCat = {};
  for (const t of [...txOut, ...cardSpend]) { const c = String(t.cat || "Lain-lain").trim() || "Lain-lain"; byCat[c] = (byCat[c] || 0) + (Number(t.amount) || 0); }
  const months = new Set([...txOut, ...cardSpend, ...txIn].map(t => String(t.date).slice(0, 7)));
  const incCurrent = all || Number(year) === today.getFullYear();
  const income = sum(txIn, t => t.amount);
  const receivedNow = sum(S.tx.filter(t => t.type === "in" && String(t.date).slice(0, 7) === curYM), t => t.amount);
  const expected = incCurrent && receivedNow === 0 ? sum(S.incomes, i => i.amount) : 0;
  const spent = sum(txOut, t => t.amount) + sum(cardSpend, t => t.amount);
  const pending = incCurrent ? monthOut(S, today).pending : 0;
  const balance = income - spent;
  return { income, expected, spent, pending, balance, projected: balance + expected - pending, byCat, months: months.size };
}

// Aliran sebulan, sama definisi dengan ringkasan: masuk = transaksi Masuk; keluar = transaksi Keluar
// (kecuali bayaran bil kad) + belanja kad kredit.
function monthFlow(S, m) {
  const inM = t => String(t.date).slice(0, 7) === m;
  return {
    m,
    in: sum(S.tx.filter(t => t.type === "in" && inM(t)), t => t.amount),
    out: sum(S.tx.filter(t => t.type === "out" && inM(t) && t.cat !== "Kad kredit"), t => t.amount)
       + sum(S.cardTx.filter(t => t.type === "belanja" && inM(t)), t => t.amount)
  };
}
// sel: "6" / "12" = bulan terakhir; "2027" = Jan–Dis tahun itu.
function trendMonths(sel, today) {
  if (/^\d{4}$/.test(String(sel))) return Array.from({ length: 12 }, (_, i) => sel + "-" + String(i + 1).padStart(2, "0"));
  const n = Number(sel) || 6, out = [];
  for (let i = n - 1; i >= 0; i--) out.push(ym(new Date(today.getFullYear(), today.getMonth() - i, 1)));
  return out;
}

// Status bayaran setiap belanja kad: bayaran kad menutup belanja paling lama dahulu (FIFO).
function cardAlloc(S, cardId) {
  const rows = S.cardTx.filter(t => t.cardId === cardId);
  let pay = sum(rows.filter(t => t.type === "bayar"), t => t.amount);
  const debits = rows.filter(t => t.type === "belanja" || t.type === "awal")
    .map((t, i) => [t, i]).sort((a, b) => String(a[0].date).localeCompare(String(b[0].date)) || a[1] - b[1]).map(x => x[0]);
  const out = {};
  for (const t of debits) {
    const amt = Number(t.amount) || 0, covered = Math.min(amt, pay);
    pay -= covered;
    const owed = Math.round((amt - covered) * 100) / 100;
    out[t.id] = { covered, owed, status: owed <= 0 ? "dibayar" : covered > 0 ? "separa" : "belum" };
  }
  return out;
}
// Tarikh akhir bayaran kad yang seterusnya (hari ini atau selepas).
function nextDue(dueDay, today) {
  const day = Number(dueDay);
  if (!(day >= 1 && day <= 31)) return null;
  const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  for (const off of [0, 1]) {
    const y = t0.getFullYear(), m = t0.getMonth() + off;
    const d = new Date(y, m, Math.min(day, dim(new Date(y, m, 1).getFullYear(), new Date(y, m, 1).getMonth())));
    if (d >= t0) return { date: ymd(d), diff: Math.round((d - t0) / 86400000) };
  }
  return null;
}

// Data laporan bulanan (m = "YYYY-MM"). Definisi sama dengan ringkasan: bayaran bil kad tidak dikira dalam Keluar.
function monthReport(S, m, today) {
  const inM = t => String(t.date).slice(0, 7) === m;
  const cardNm = id => (S.cards.find(c => c.id === id) || { name: "(kad dipadam)" }).name;
  const flow = monthFlow(S, m);
  const rows = [
    ...S.tx.filter(inM).map(t => ({ date: t.date, cat: t.cat, note: t.note || "", type: t.type, amount: Number(t.amount) || 0,
      via: t.type === "in" ? "" : t.cat === "Kad kredit" ? "Bayar bil kad" : "Tunai / debit", bill: t.type === "out" && t.cat === "Kad kredit" })),
    ...S.cardTx.filter(t => t.type === "belanja" && inM(t)).map(t => ({ date: t.date, cat: t.cat, note: t.note || "", type: "out", amount: Number(t.amount) || 0, via: "Kad " + cardNm(t.cardId), bill: false }))
  ].sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const byCatObj = {};
  for (const r of rows) if (r.type === "out" && !r.bill) { const c = String(r.cat || "Lain-lain").trim() || "Lain-lain"; byCatObj[c] = (byCatObj[c] || 0) + r.amount; }
  const byCat = Object.entries(byCatObj).sort((a, b) => b[1] - a[1]).map(([cat, amount]) => ({ cat, amount, pct: flow.out ? amount / flow.out * 100 : 0 }));
  const commitments = S.commitments.map(c => ({ name: c.name, amount: Number(c.amount) || 0, day: c.day, paid: !!S.paid[c.id + ":" + m] }));
  const debts = S.debts.map(d => ({ name: d.name, balance: Number(d.balance) || 0, rate: Number(d.rate) || 0, payment: Number(d.payment) || 0, day: d.day, paid: !!S.paid[d.id + ":" + m] }));
  const cards = S.cards.map(c => {
    const t = S.cardTx.filter(x => x.cardId === c.id && inM(x));
    const k = cardCalc(S, c, today);
    return { name: c.name, spend: sum(t.filter(x => x.type === "belanja"), x => x.amount), paid: sum(t.filter(x => x.type === "bayar"), x => x.amount), balance: k.balance, limit: k.limit, util: k.util };
  });
  const c = calc(S), e = emergencyCalc(S, today);
  return { m, in: flow.in, out: flow.out, net: flow.in - flow.out, byCat, rows, commitments, debts, cards,
    committed: c.out, dsr: c.dsr, dsrLevel: c.dsrLevel,
    emergency: { asb: asbHave(S), asbTarget: Number(S.asb.s1) || 0, th: thHave(S), thTarget: Number(S.th.target) || 0, stage: e.stage },
    gold: { have: goldHave(S), target: Number(S.gold.target) || 0 },
    budget: budgetStatus(S, m),
    deposits: S.deposits.filter(inM).slice().sort((a, b) => String(a.date).localeCompare(String(b.date))) };
}

// Helaian Excel sebagai tatasusunan baris. m = "YYYY-MM" atau "" (semua data).
// Setiap helaian: { name, rows, money: [indeks lajur RM], grams: [indeks lajur gram], dates: [indeks lajur tarikh] }
function excelSheets(S, m, today) {
  const inR = t => !m || String(t.date).slice(0, 7) === m;
  const cardNm = id => (S.cards.find(c => c.id === id) || { name: "(kad dipadam)" }).name;
  const KL = { emas: "Emas", asb: "ASB", th: "Tabung Haji" };
  const n2 = v => Math.round((Number(v) || 0) * 100) / 100;
  // Ringkasan
  const ys = m ? null : yearSummary(S, 0, today);
  const flow = m ? monthFlow(S, m) : { in: ys.income, out: ys.spent };
  const tx = S.tx.filter(inR), ctx = S.cardTx.filter(inR);
  const byCat = {};
  for (const t of tx) if (t.type === "out" && t.cat !== "Kad kredit") byCat[t.cat || "Lain-lain"] = (byCat[t.cat || "Lain-lain"] || 0) + (Number(t.amount) || 0);
  for (const t of ctx) if (t.type === "belanja") byCat[t.cat || "Lain-lain"] = (byCat[t.cat || "Lain-lain"] || 0) + (Number(t.amount) || 0);
  const c = calc(S);
  const ring = [
    ["Laporan kewangan", m ? fmtYMx(m) : "Semua data"],
    ["Nama", S.settings.name || ""],
    [],
    ["Masuk (RM)", n2(flow.in)],
    ["Keluar (RM)", n2(flow.out)],
    ["Bersih (RM)", n2(flow.in - flow.out)],
    ["Komitmen + hutang sebulan (RM)", n2(c.out)],
    ["DSR", isFinite(c.dsr) ? Math.round(c.dsr) + "% (" + c.dsrLevel + ")" : "—"],
    [],
    ["Duit keluar ikut kategori", "Jumlah (RM)", "%"],
    ...Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([k, v]) => [k, n2(v), flow.out ? Math.round(v / flow.out * 1000) / 10 : 0])
  ];
  // Transaksi (tunai + belanja kad)
  const trx = [["Tarikh", "Jenis", "Kategori", "Nota", "Cara bayar", "Jumlah (RM)", "Dikira dalam Keluar"],
    ...[...tx.map(t => [t.date, t.type === "in" ? "Masuk" : "Keluar", t.cat, t.note || "", t.type === "in" ? "" : t.cat === "Kad kredit" ? "Bayar bil kad" : "Tunai / debit", n2(t.amount), t.type === "in" ? "" : t.cat === "Kad kredit" ? "Tidak" : "Ya"]),
       ...ctx.filter(t => t.type === "belanja").map(t => [t.date, "Keluar", t.cat, t.note || "", "Kad " + cardNm(t.cardId), n2(t.amount), "Ya"])]
      .sort((a, b) => String(a[0]).localeCompare(String(b[0])))];
  // Kad kredit
  const alloc = Object.assign({}, ...S.cards.map(k => cardAlloc(S, k.id)));
  const ST = { dibayar: "Sudah bayar", separa: "Separa", belum: "Belum bayar" };
  const kad = [["Tarikh", "Kad", "Jenis", "Kategori", "Nota", "Jumlah (RM)", "Status bayar", "Baki belum bayar (RM)"],
    ...ctx.slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).map(t => [t.date, cardNm(t.cardId), { belanja: "Belanja", bayar: "Bayaran", awal: "Baki awal" }[t.type] || t.type, t.cat || "", t.note || "", n2(t.amount),
      t.type === "bayar" ? "" : (ST[(alloc[t.id] || {}).status] || ""), t.type === "bayar" ? "" : n2((alloc[t.id] || {}).owed)]),
    [],
    ["Ringkasan kad", "Had (RM)", "Baki semasa (RM)", "% had"],
    ...S.cards.map(k => { const r = cardCalc(S, k, today); return [k.name, n2(r.limit), n2(r.balance), Math.round(r.util * 10) / 10]; })];
  // Simpanan
  const sim = [["Tarikh", "Akaun", "Jenis", "Gram", "Jumlah (RM)", "Nota"],
    ...S.deposits.filter(inR).slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).map(d => [d.date, KL[d.kind] || d.kind,
      d.dir === "out" ? (d.kind === "emas" ? "Jual" : "Keluarkan") : (d.kind === "emas" ? "Beli" : "Simpan"), d.kind === "emas" ? Number(d.grams) || 0 : "", n2(d.amount), d.note || ""]),
    [],
    ["Jumlah semasa", "Ada", "Sasaran"],
    ["Emas (gram)", goldHave(S), Number(S.gold.target) || 0],
    ["ASB · Stage 1 (RM)", asbHave(S), Number(S.asb.s1) || 0],
    ["Tabung Haji · Stage 2 (RM)", thHave(S), Number(S.th.target) || 0]];
  // Komitmen & hutang
  const km = [["Perkara", "Jenis", "Hari bayar", "Jumlah sebulan (RM)", "Baki hutang (RM)", "Faedah %", m ? "Status " + fmtYMx(m) : "Status bulan ini"],
    ...S.commitments.map(x => [x.name, "Komitmen", Number(x.day) || "", n2(x.amount), "", "", S.paid[x.id + ":" + (m || ym(today))] ? "Sudah bayar" : "Belum bayar"]),
    ...S.debts.map(x => [x.name, "Hutang", Number(x.day) || "", n2(x.payment), n2(x.balance), Number(x.rate) || 0, (Number(x.balance) || 0) <= 0 ? "Selesai" : S.paid[x.id + ":" + (m || ym(today))] ? "Sudah bayar" : "Belum bayar"])];
  return [
    { name: "Ringkasan", rows: ring, money: [1], cols: [34, 16, 8] },
    { name: "Transaksi", rows: trx, money: [5], dates: [0], cols: [12, 9, 18, 30, 20, 13, 10] },
    { name: "Kad kredit", rows: kad, money: [5, 7], dates: [0], cols: [12, 18, 10, 16, 24, 13, 13, 14] },
    { name: "Simpanan", rows: sim, money: [4], grams: [3], dates: [0], cols: [26, 14, 10, 10, 13, 24] },
    { name: "Komitmen & hutang", rows: km, money: [3, 4], cols: [24, 10, 9, 14, 14, 9, 16] },
    ...(S.budgets.length ? [{ name: "Bajet", money: [2, 3, 4], cols: [10, 22, 13, 13, 13, 7, 12], rows: (() => {
      const months = m ? [m] : [...new Set([...S.tx, ...S.cardTx].map(t => String(t.date).slice(0, 7)))].filter(x => /^\d{4}-\d{2}$/.test(x)).sort();
      const out = [["Bulan", "Kategori", "Bajet (RM)", "Belanja (RM)", "Baki (RM)", "%", "Status"]];
      for (const mm of months) for (const b of budgetStatus(S, mm).rows)
        out.push([fmtYMx(mm), b.cat, n2(b.amount), n2(b.spent), n2(b.left), isFinite(b.pct) ? Math.round(b.pct) : "", { lebih: "Lebih bajet", hampir: "Hampir", ok: "OK" }[b.level]]);
      return out;
    })() }] : [])
  ];
}
const fmtYMx = k => { const B = ["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogo","Sep","Okt","Nov","Dis"]; const [y, mm] = String(k).split("-"); return B[+mm - 1] + " " + y; };

// Bajet: kategori dipadankan tanpa kira huruf besar/kecil & ruang. Belanja = definisi sama dengan ringkasan
// (tx Keluar kecuali "Kad kredit" + belanja kad).
const catKey = c => String(c || "Lain-lain").trim().replace(/\s+/g, " ").toLowerCase();
function spendByCat(S, m) {
  const out = {};
  const add = (cat, amt) => { const k = catKey(cat); if (!out[k]) out[k] = { label: String(cat || "Lain-lain").trim() || "Lain-lain", amount: 0 }; out[k].amount += Number(amt) || 0; };
  for (const t of S.tx) if (t.type === "out" && t.cat !== "Kad kredit" && String(t.date).slice(0, 7) === m) add(t.cat, t.amount);
  for (const t of S.cardTx) if (t.type === "belanja" && String(t.date).slice(0, 7) === m) add(t.cat, t.amount);
  return out;
}
function budgetStatus(S, m) {
  const sp = spendByCat(S, m);
  const rows = S.budgets.map(b => {
    const amount = Number(b.amount) || 0, spent = Math.round(((sp[catKey(b.cat)] || {}).amount || 0) * 100) / 100;
    const pct = amount > 0 ? spent / amount * 100 : spent > 0 ? Infinity : 0;
    return { id: b.id, cat: b.cat, amount, spent, left: Math.round((amount - spent) * 100) / 100, pct, level: pct > 100 ? "lebih" : pct >= 80 ? "hampir" : "ok" };
  }).sort((a, b) => b.pct - a.pct);
  const keys = new Set(S.budgets.map(b => catKey(b.cat)));
  const unbudgeted = Object.entries(sp).filter(([k]) => !keys.has(k)).map(([, v]) => ({ cat: v.label, spent: Math.round(v.amount * 100) / 100 })).sort((a, b) => b.spent - a.spent);
  const budget = sum(rows, r => r.amount), spentB = sum(rows, r => r.spent);
  return { rows, unbudgeted, budget, spent: spentB, unbudgetedTotal: sum(unbudgeted, u => u.spent), pct: budget ? spentB / budget * 100 : 0 };
}

// ---------- pengesan notifikasi telefon (bank / e-wallet) ----------
// Pulangkan { type: "in"|"out", amount, merchant, cat } atau null jika bukan transaksi / tidak pasti.
const N_ABAI = /(\bOTP\b|\bTAC\b|kod pengesahan|verification code|promo|cashback|dapatkan|jom |win |menang|offer|tawaran|voucher|baucar|reload|top[ -]?up|tambah nilai|own account|akaun sendiri|antara akaun|balance is|baki anda ialah|statement|penyata|reminder|peringatan|due date|tarikh akhir|failed|gagal|unsuccessful|tidak berjaya|declined|ditolak|pending|log ?in|log masuk|new device|peranti baru)/i;

// ---------- tong sampah & pulih ----------
const LISTS = ["incomes", "commitments", "debts", "tx", "goals", "ventures", "cards", "cardTx", "deposits", "budgets"];
const LIST_LABEL = { incomes: "Pendapatan", commitments: "Komitmen", debts: "Hutang", tx: "Transaksi", goals: "Matlamat", ventures: "Projek niaga", cards: "Kad kredit", cardTx: "Rekod kad", deposits: "Rekod simpanan", budgets: "Bajet", steps: "Langkah projek" };

function trashItem(S, list, id, now) {

function describeItem(list, it) {

// Item bayaran berulang (komitmen, hutang aktif, kad dengan baki) untuk kalendar.
function billItems(S, today) {

    ...S.debts.filter(d => (Number(d.balance) || 0) > 0).map(d => ({ id: d.id, name: d.name, amount: Number(d.payment) || 0, day: Number(d.day) })),

// Fail kalendar iCalendar (.ics): acara bulanan berulang hingga 31 Dis 2030 dengan peringatan.
function buildICS(S, today, notifyDays = 3) {

  const d8 = d => d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
  const stamp = today.toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");

    let start = new Date(today.getFullYear(), today.getMonth(), Math.min(it.day, dim(today.getFullYear(), today.getMonth())));
    if (last) start = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 1);
    const title = "Bayar " + it.name + (it.amount ? " — RM" + (Number(it.amount) || 0).toFixed(2) : "");

      `SUMMARY:${escT(title)}`, `DESCRIPTION:${escT("Peringatan dari app Pelan 2030" + (last ? " (hari terakhir bulan)" : ""))}`, "TRANSP:TRANSPARENT");
    if (n > 0) lines.push("BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${escT(title)}`, `TRIGGER:-P${n - 1}DT15H`, "END:VALARM");
    lines.push("BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${escT(title)}`, "TRIGGER:PT9H", "END:VALARM", "END:VEVENT");

function stable(v) {

// Perubahan kedua-dua pihak dikekalkan; senarai bertanda `id` digabung ikut item;
// jika medan yang sama diubah di kedua-dua pihak, peranti ini menang; suntingan menang ke atas pemadaman.
function merge3(b, l, r) {
  const isObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
  const idArr = v => Array.isArray(v) && v.every(x => isObj(x) && x.id != null);
  if (same(l, r)) return l;
  if (same(l, b)) return r;
  if (same(r, b)) return l;
  if (idArr(l) && idArr(r) && (b == null || idArr(b))) {
    const toMap = a => Object.fromEntries((a || []).map(x => [x.id, x]));
    const m = merge3(toMap(b), toMap(l), toMap(r));
    const ids = l.map(x => x.id);
    for (const x of r) if (!ids.includes(x.id)) ids.push(x.id);
    return ids.filter(id => m[id] !== undefined).map(id => m[id]);
  }
  if (isObj(l) && isObj(r)) {
    const bo = isObj(b) ? b : {}, out = {};
    for (const k of new Set([...Object.keys(l), ...Object.keys(r)])) {
      const v = merge3(bo[k], l[k], r[k]);
      if (v !== undefined) out[k] = v;

}

}

/* ---------- penyegerakan awan (Supabase) ---------- */

async function syncNow() {

    setSync("Disegerak " + jam());

    const m = String((e && e.message) || e);

}
function afterAttach() {

    .on("postgres_changes", { event: "INSERT", schema: "public", table: "incoming", filter: "plan_id=eq." + plan.id }, () => importIncoming())

async function importIncoming() {

    const { data, error } = await sb.from("incoming").select("id, amount, tx_date, description").eq("plan_id", plan.id).eq("imported", false).order("id").limit(50);
    if (error || !data || !data.length) return;

    for (const r of data) {
      const id = "inc-" + r.id;   // id tetap: telefon lain yang import serentak tidak menggandakan
      if (S.tx.some(t => t.id === id) || S.trash[id]) continue;
      if (isDupAuto(S, "in", Number(r.amount) || 0, r.tx_date, "inc-")) continue;   // sudah dicatat dari notifikasi
      const desc = String(r.description || "").trim();
      S.tx.push({ id, date: r.tx_date, type: "in", cat: /gaji|salary|payroll|upah|elaun/i.test(desc) ? "Gaji" : "Duit masuk", amount: Number(r.amount) || 0, note: (desc ? desc.slice(0, 80) + " · " : "") + "auto e-mel" });

    if (n) { commit(); toast(`${n} duit masuk dicatat automatik dari e-mel (${RM(total)})`); }
  } catch {} finally { importing = false; }

async function importNotif() {

  try {
    const { data, error } = await sb.from("notif_inbox").select("id, app, body, created_at").eq("plan_id", plan.id).eq("processed", false).order("id").limit(100);
    if (error || !data || !data.length) return;
    const res = {}; let nin = 0, nout = 0, tin = 0, tout = 0;
    for (const r of data) {
      const id = "ntf-" + r.id, date = ymd(new Date(r.created_at));

      if (S.tx.some(t => t.id === id) || S.trash[id]) { res[r.id] = "dicatat"; continue; }
      if (isDupAuto(S, k.type, k.amount, date, "ntf-")) { res[r.id] = "pendua"; continue; }
      S.tx.push({ id, date, type: k.type, cat: k.cat, amount: k.amount, note: (k.merchant ? k.merchant + " · " : "") + "auto notifikasi" + (r.app ? " (" + String(r.app).slice(0, 30) + ")" : "") });
      res[r.id] = "dicatat";
      if (k.type === "in") { nin++; tin += k.amount; } else { nout++; tout += k.amount; }
    }

      await sb.from("notif_inbox").update({ processed: true, result }).in("id", Object.keys(res).filter(i => res[i] === result).map(Number));
    if (nin || nout) { commit(); toast("Dari notifikasi: " + [nin ? `${nin} masuk ${RM(tin)}` : "", nout ? `${nout} keluar ${RM(tout)}` : ""].filter(Boolean).join(" · ")); }

}

function loadScript(src) {
  return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => rej(new Error("gagal muat")); document.head.appendChild(el); });
}
async function exportExcel(all) {
  const m = all ? "" : reportMonth;
  const sheets = excelSheets(S, m, today());
  const fname = "Pelan2030-" + (m || "semua-data") + ".xlsx";
  try {
    if (!window.XLSX) { toast("Menyediakan Excel…"); await loadScript("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"); }
    const X = window.XLSX, wb = X.utils.book_new();
    for (const sh of sheets) {
      const rows = sh.rows.map((r, ri) => r.map((v, ci) => (sh.dates || []).includes(ci) && ri > 0 && /^\d{4}-\d{2}-\d{2}$/.test(v) ? new Date(v + "T00:00:00") : v));
      const ws = X.utils.aoa_to_sheet(rows, { cellDates: true });
      const rng = X.utils.decode_range(ws["!ref"] || "A1");
      for (let R = 1; R <= rng.e.r; R++) for (let C = 0; C <= rng.e.c; C++) {
        const cell = ws[X.utils.encode_cell({ r: R, c: C })];
        if (!cell) continue;
        if (cell.t === "n" && (sh.money || []).includes(C)) cell.z = "#,##0.00";
        if (cell.t === "n" && (sh.grams || []).includes(C)) cell.z = "0.000";
        if (cell.t === "d") cell.z = "dd/mm/yyyy";
      }
      ws["!cols"] = (sh.cols || []).map(w => ({ wch: w }));
      X.utils.book_append_sheet(wb, ws, sh.name);
    }
    X.writeFile(wb, fname);
    toast("Excel dimuat turun: " + fname);
  } catch (e) {
    // Luar talian / CDN gagal: eksport CSV (boleh dibuka dalam Excel) — helaian Transaksi sahaja.
    const csv = "\ufeff" + sheets[1].rows.map(r => r.map(v => { const t = String(v ?? ""); return /[",\n;]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; }).join(",")).join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = fname.replace(".xlsx", "-transaksi.csv"); document.body.appendChild(a); a.click(); a.remove();
    toast("Tiada internet untuk Excel penuh — fail CSV transaksi dimuat turun");
  }
}

function budgetBar(r) {
  const cls = r.level === "lebih" ? "" : r.level === "hampir" ? "amber" : "";
  const col = r.level === "lebih" ? "var(--bad)" : r.level === "hampir" ? "var(--warn)" : "var(--teal)";
  return `<div class="bar ${cls}" role="progressbar" aria-valuenow="${Math.round(Math.min(r.pct, 999))}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.min(100, r.pct)}%;background:${col}"></i></div>`;
}
function vBudget() {
  const b = budgetStatus(S, budgetMonth);
  const cats = [...new Set([...BUDGET_CATS, ...S.tx.filter(t => t.type === "out" && t.cat !== "Kad kredit").map(t => t.cat), ...S.cardTx.filter(t => t.type === "belanja").map(t => t.cat)].filter(Boolean).map(c => String(c).trim()))];
  const pillB = r => r.level === "lebih" ? `<span class="pill bad">Lebih ${RM(-r.left)}</span>` : r.level === "hampir" ? `<span class="pill warn">Baki ${RM(r.left)}</span>` : `<span class="pill ok">Baki ${RM(r.left)}</span>`;
  return `<section class="card" id="bajet">
    <div class="row between"><h2>Bajet bulanan</h2>${monthSelect("budgetmonth", budgetMonth, [...S.tx, ...S.cardTx].map(t => t.date)).replace(/<option value="" (selected)?>Semua bulan<\/option>/, "")}</div>
    ${S.budgets.length ? `<div class="row between small" style="margin-top:4px"><span>Belanja ${RM(b.spent)} / bajet ${RM(b.budget)}</span><span>${b.pct.toFixed(0)}%</span></div>
    ${budgetBar({ pct: b.pct, level: b.pct > 100 ? "lebih" : b.pct >= 80 ? "hampir" : "ok" })}
    <ul class="list" style="margin-top:8px">${b.rows.map(r => `<li style="align-items:flex-start"><div class="grow">
        <div class="row between"><span>${esc(r.cat)}</span>${pillB(r)}</div>
        <div class="row between small muted" style="margin:2px 0 4px"><span>${RM(r.spent)} / ${RM(r.amount)}</span><span>${isFinite(r.pct) ? r.pct.toFixed(0) + "%" : "—"}</span></div>
        ${budgetBar(r)}
      </div>
      <input type="number" inputmode="decimal" step="0.01" min="0" value="${r.amount}" data-act="budgetamt" data-id="${r.id}" aria-label="Bajet ${esc(r.cat)}" style="width:96px">
      ${del("budgets", r.id)}</li>`).join("")}</ul>` : `<p class="empty">Belum ada bajet. Tetapkan had sebulan bagi setiap kategori — belanja tunai dan kad kredit dikira automatik.</p>`}
    ${b.unbudgeted.length ? `<p class="small muted" style="margin:10px 0 4px">Belanja tanpa bajet: <b>${RM(b.unbudgetedTotal)}</b> — ${b.unbudgeted.slice(0, 6).map(u => `<button class="ghost sm" data-act="budgetquick" data-cat="${esc(u.cat)}" data-amt="${Math.ceil(u.spent / 10) * 10}" title="Tambah bajet">${esc(u.cat)} ${RM(u.spent)} ＋</button>`).join(" ")}</p>` : ""}
    <form class="add" data-form="budget">
      <label>Kategori<input name="cat" list="budgetcats" required placeholder="cth. Makan"></label>
      <label>Bajet sebulan (RM)<input name="amount" type="number" inputmode="decimal" step="0.01" min="0.01" required></label>
      <button class="primary">Tetapkan bajet</button>
    </form>
    <datalist id="budgetcats">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
    <p class="small muted">Nama kategori mesti sama dengan kategori transaksi (huruf besar/kecil tidak penting). Bajet berulang setiap bulan.</p>
  </section>`;
}
// Amaran selepas rekod belanja jika bajet kategori itu hampir habis / lebih.
function budgetWarn(cat, date) {
  const m = String(date).slice(0, 7);
  const r = budgetStatus(S, m).rows.find(x => catKey(x.cat) === catKey(cat));
  if (!r || r.level === "ok") return "";
  return r.level === "lebih" ? ` · ⚠️ Bajet ${r.cat} lebih ${RM(-r.left)}` : ` · Bajet ${r.cat} ${r.pct.toFixed(0)}% digunakan`;
}

function vKewangan() {
  const c = calc(S), t = today();
  const inSel = x => !txMonth || String(x.date).slice(0, 7) === txMonth;
  const alloc = Object.assign({}, ...S.cards.map(c => cardAlloc(S, c.id)));
  const cardRows = S.cardTx.filter(x => x.type === "belanja" && inSel(x)).map(x => ({ ...x, _card: true }));
  const rows = [...S.tx.filter(inSel), ...cardRows].sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const isBill = r => !r._card && r.type === "out" && r.cat === "Kad kredit";
  const tin = sum(rows.filter(r => !r._card && r.type === "in"), r => r.amount);
  const tout = sum(rows.filter(r => r._card || (r.type === "out" && !isBill(r))), r => r.amount);
  const gs = savCalc(goldHave(S), S.gold.target, S.gold.by, t);
  const { s1, s2, stage } = emergencyCalc(S, t);
  const stLine = (sv, label) => sv.need ? `Perlu ${RM(sv.need)} lagi · ${isFinite(sv.perMonth) ? RM(sv.perMonth) + " sebulan" : "tarikh sasaran sudah lepas"}` : label + " tercapai ✓";
  const pill = n => stage === n ? `<span class="pill warn">Sedang dibina</span>` : stage > n ? `<span class="pill ok">Selesai</span>` : `<span class="pill">Seterusnya</span>`;
  return `
  <section class="card">
    <h2>Laporan & eksport</h2>
    <p class="small muted"><b>PDF</b>: laporan sebulan (dalam dialog cetak pilih <b>Simpan sebagai PDF</b>). <b>Excel</b>: fail .xlsx dengan helaian Ringkasan, Transaksi, Kad kredit, Simpanan dan Komitmen & hutang.</p>
    <div class="row">${monthSelect("reportmonth", reportMonth, [...S.tx, ...S.cardTx].map(t => t.date)).replace('<option value="" selected>Semua bulan</option>', "").replace('<option value="" >Semua bulan</option>', "")}<button class="primary" data-act="pdf">Eksport PDF</button><button data-act="xlsx">Eksport Excel</button></div>
    <button class="ghost sm" data-act="xlsxall" style="margin-top:6px">Excel semua data</button>
  </section>

  ${vBudget()}

  <section class="card">
    <h2>Sumber pendapatan</h2>
    ${S.incomes.length ? `<ul class="list">${S.incomes.map(i => `<li><div class="grow"><div>${esc(i.name)}</div><span class="pill">${i.type}</span></div><span class="num">${RM(i.amount)}</span>${del("incomes", i.id)}</li>`).join("")}</ul>` : `<p class="empty">Belum ada pendapatan.</p>`}
    <form class="add" data-form="income">
      <label>Nama<input name="name" required placeholder="cth. Gaji"></label>
      <label>Jenis<select name="type"><option value="aktif">Aktif</option><option value="sampingan">Sampingan</option><option value="pasif">Pasif</option></select></label>
      <label>Jumlah sebulan (RM)<input name="amount" type="number" inputmode="decimal" min="0" step="0.01" required></label>
      <button class="primary">Tambah</button>
    </form>
  </section>

  <section class="card">
    <div class="row between"><h2>Transaksi</h2>${monthSelect("txmonth", txMonth, [...S.tx, ...S.cardTx].map(t => t.date))}</div>
    ${txMonth ? "" : `<p class="small muted" style="margin:0 0 6px">Semua bulan · ${rows.length} transaksi</p>`}
    <div class="grid3">${stat("Masuk", RM(tin), "pos")}${stat("Keluar", RM(tout), "neg")}${stat("Bersih", RM(tin - tout), tin - tout >= 0 ? "pos" : "neg")}</div>
    ${rows.length ? `<ul class="list" style="margin-top:8px">${withMonthHeads(rows, !txMonth, r => r._card
      ? `<li><div class="grow"><div>${esc(r.cat)}${r.note ? ` <span class="muted small">· ${esc(r.note)}</span>` : ""}</div><div class="small muted">${fmtD(r.date)} · 💳 ${esc(cardName(r.cardId))}</div><div style="margin-top:4px">${payPill(alloc[r.id])}</div></div>
      <span class="num neg">−${RM(r.amount)}</span>${del("cardTx", r.id)}</li>`
      : `<li><div class="grow"><div>${esc(r.cat)}${r.note ? ` <span class="muted small">· ${esc(r.note)}</span>` : ""}</div><div class="small muted">${fmtD(r.date)}${isBill(r) ? " · bayar bil kad (tidak dikira dalam Keluar)" : ""}</div></div>
      <span class="num ${r.type === "in" ? "pos" : isBill(r) ? "muted" : "neg"}">${r.type === "in" ? "+" : "−"}${RM(r.amount)}</span>${del("tx", r.id)}</li>`)}</ul>` : `<p class="empty">${txMonth ? "Tiada transaksi untuk " + fmtYM(txMonth) : "Belum ada transaksi"}.</p>`}
    <form class="add" data-form="tx">
      <label>Tarikh<input name="date" type="date" value="${ymd(t)}" required></label>
      <label>Jenis<select name="type"><option value="out">Keluar</option><option value="in">Masuk</option></select></label>
      <label>Kategori<input name="cat" required list="cats" placeholder="cth. Makan"></label>
      <label>Jumlah (RM)<input name="amount" type="number" inputmode="decimal" min="0" step="0.01" required></label>
      <label>Nota<input name="note"></label>
      ${S.cards.length ? `<label>Bayar guna<select name="via"><option value="">Tunai / debit</option>${S.cards.map(c => `<option value="${c.id}">💳 ${esc(c.name)}</option>`).join("")}</select></label>` : ""}
      <button class="primary">Rekod</button>
    </form>
    <datalist id="cats">${["Gaji","Sampingan","Pasif","Makan","Pengangkutan","Sewa","Utiliti","Komitmen","Hutang","Simpanan","Emas","ASB","Tabung Haji","Kursus","Lain-lain"].map(x => `<option value="${x}">`).join("")}</datalist>
  </section>

  <section class="card">
    <h2>Sasaran emas</h2>
    <div class="row between small"><span>${fmtG(goldHave(S))} / ${fmtG(S.gold.target)}${S.gold.price ? ` · nilai ${RM(goldHave(S) * S.gold.price)}` : ""}</span><span>${gs.pct.toFixed(0)}%</span></div>
    ${bar(gs.pct, "gold")}
    <p class="small muted">${gs.need ? `Perlu ${fmtG(gs.need)} lagi · ${isFinite(gs.perMonth) ? fmtG(gs.perMonth) + " sebulan" : "tarikh sasaran sudah lepas"}${S.gold.price ? ` (≈ ${RM(gs.perMonth * S.gold.price)})` : ""}` : "Sasaran tercapai 🎉"}</p>
    ${goldCost(S) ? `<p class="small muted" style="margin-top:-6px">Kos belian direkod ${RM(goldCost(S))}${depTotal(S, "emas") > 0 ? ` · purata ${RM(goldCost(S) / sum(S.deposits.filter(d => d.kind === "emas" && d.dir !== "out"), d => d.grams))}/g` : ""}</p>` : ""}
    ${depForm("emas")}
    ${depList(["emas"])}
    <details style="margin-top:10px"><summary>Tetapan emas (baki awal, sasaran, harga semasa)</summary>
    <form class="add" data-form="gold">
      <label>Baki awal sebelum rekod (gram)<input name="have" type="number" inputmode="decimal" step="0.001" min="0" value="${S.gold.have}"></label>
      <label>Sasaran (gram)<input name="target" type="number" inputmode="decimal" step="0.001" min="0" value="${S.gold.target}"></label>
      <label>Harga semasa RM/gram<input name="price" type="number" inputmode="decimal" step="0.01" min="0" value="${S.gold.price}"></label>
      <label>Menjelang<input name="by" type="month" value="${S.gold.by}"></label>
      <button>Simpan</button>
    </form></details>
  </section>

  <section class="card">
    <h2>Dana kecemasan</h2>
    <div class="row between small"><span>${RM(c.emergencyHave)} / ${RM(c.emergencyTarget)}</span><span>${c.emergencyPct.toFixed(0)}%</span></div>
    ${bar(c.emergencyPct)}
    <p class="small muted">${c.out > 0 ? `Bersamaan ≈ ${c.emergencyMonths.toFixed(1)} bulan komitmen + hutang (${RM(c.out)} sebulan)${S.savings ? `, termasuk simpanan lain ${RM(S.savings)}` : ""}.` : "Tambah komitmen dan hutang untuk lihat berapa bulan dana ini boleh bertahan."}</p>

    <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px">
      <div class="row between"><h3 style="margin:0">Stage 1 (ASB) · ${RM(S.asb.s1)}</h3>${pill(1)}</div>
      <div class="row between small" style="margin-top:6px"><span>${RM(asbHave(S))} / ${RM(S.asb.s1)} menjelang ${fmtYM(S.asb.s1by)}</span><span>${s1.pct.toFixed(0)}%</span></div>
      ${bar(s1.pct, "amber")}
      <p class="small muted">${stLine(s1, "Stage 1")}</p>
    </div>
    <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px">
      <div class="row between"><h3 style="margin:0">Stage 2 (Tabung Haji) · ${RM(S.th.target)}</h3>${pill(2)}</div>
      <div class="row between small" style="margin-top:6px"><span>${RM(thHave(S))} / ${RM(S.th.target)} menjelang ${fmtYM(S.th.by)}</span><span>${s2.pct.toFixed(0)}%</span></div>
      ${bar(s2.pct, "gold")}
      <p class="small muted">${stLine(s2, "Stage 2")}</p>
    </div>

    <h3 style="margin-top:16px">Rekod simpanan ASB / Tabung Haji</h3>
    ${depForm("dana")}
    ${depList(["asb", "th"])}
    <details style="margin-top:12px"><summary>Tetapan (baki awal & sasaran)</summary>
    <form class="add" data-form="emergency">
      <label>Baki awal ASB sebelum rekod (RM)<input name="asbHave" type="number" inputmode="decimal" step="0.01" min="0" value="${S.asb.have}"></label>
      <label>Sasaran stage 1 (RM)<input name="s1" type="number" inputmode="decimal" step="0.01" min="0" value="${S.asb.s1}"></label>
      <label>Stage 1 menjelang<input name="s1by" type="month" value="${S.asb.s1by}"></label>
      <label>Baki awal Tabung Haji sebelum rekod (RM)<input name="thHave" type="number" inputmode="decimal" step="0.01" min="0" value="${S.th.have}"></label>
      <label>Sasaran stage 2 (RM)<input name="thTarget" type="number" inputmode="decimal" step="0.01" min="0" value="${S.th.target}"></label>
      <label>Stage 2 menjelang<input name="thBy" type="month" value="${S.th.by}"></label>
      <label>Simpanan tunai lain (RM)<input name="savings" type="number" inputmode="decimal" step="0.01" min="0" value="${S.savings}"></label>
      <button class="primary">Simpan</button>
    </form></details>
  </section>`;
}

const CARD_CATS = ["Makan", "Minyak", "Barang dapur", "Bil", "Belian dalam talian", "Pakaian", "Kesihatan", "Kursus", "Perjalanan", "Lain-lain"];
let cardMonth = ym(today()), cardFilter = "";
function cardDueLine(c, k) {
  if (k.balance <= 0) return `<div style="margin-top:6px"><span class="pill ok">✓ Sudah bayar semua</span></div>`;
  const nd = nextDue(c.dueDay, today());
  const unpaid = Object.values(cardAlloc(S, c.id)).filter(a => a.status !== "dibayar").length;
  return `<div class="row" style="margin-top:6px;gap:6px"><span class="pill ${nd && nd.diff <= 3 ? "bad" : "warn"}">Belum bayar ${RM(k.balance)}</span><span class="small muted">${unpaid} belanja${nd ? ` · tarikh akhir ${fmtD(nd.date)} (${nd.diff === 0 ? "hari ini" : nd.diff + " hari lagi"})` : ""}</span></div>`;
}
function vKad() {
  const t = today();
  const cards = S.cards.map(c => ({ c, k: cardCalc(S, c, t) }));
  const totBal = sum(cards, x => x.k.balance), totLim = sum(cards, x => x.k.limit);
  const totUtil = totLim > 0 ? totBal / totLim * 100 : 0;
  const allocAll = Object.assign({}, ...S.cards.map(c => cardAlloc(S, c.id)));
  const rows = S.cardTx.filter(x => (!cardMonth || String(x.date).slice(0, 7) === cardMonth) && (!cardFilter || x.cardId === cardFilter)).sort((a, b) => b.date.localeCompare(a.date));
  const mSpend = sum(rows.filter(r => r.type === "belanja"), r => r.amount), mPaid = sum(rows.filter(r => r.type === "bayar"), r => r.amount);
  const cname = id => (S.cards.find(c => c.id === id) || { name: "(kad dipadam)" }).name;
  const lvl = l => l === "sihat" ? "ok" : l === "tinggi" ? "bad" : "warn";
  return `
  <section class="card">
    <div class="row between"><h2>Kad kredit</h2>${cards.length ? `<span class="pill ${lvl(totUtil < 30 ? "sihat" : totUtil <= 70 ? "x" : "tinggi")}">Guna ${totUtil.toFixed(0)}% had</span>` : ""}</div>
    ${cards.length ? `<div class="grid2">${stat("Baki semua kad", RM(totBal), totBal ? "neg" : "")}${stat("Had tersedia", RM(totLim - totBal))}</div>
    ${cards.map(({ c, k }) => `<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px">
      <div class="row between"><div><b>${esc(c.name)}</b> <span class="small muted">· bayar ${c.dueDay || "—"} hb${c.rate ? ` · ${c.rate}%` : ""}</span></div>${del("cards", c.id)}</div>
      ${cardDueLine(c, k)}
      <div class="row between small" style="margin-top:4px"><span>Baki ${RM(k.balance)} / had ${RM(k.limit)}</span><span class="pill ${lvl(k.level)}">${k.util.toFixed(0)}%</span></div>
      ${bar(k.util, k.util > 70 ? "" : "amber")}
      <div class="grid3" style="margin-top:8px">${stat("Belanja bulan ini", RM(k.monthSpend))}${stat("Bayaran minimum ≈", RM(k.minPay))}${stat("Faedah sebulan jika tak bayar penuh ≈", RM(k.interest))}</div>
      ${Object.keys(k.byCat).length ? `<p class="small muted" style="margin:.5rem 0 0">${Object.entries(k.byCat).sort((a, b) => b[1] - a[1]).map(([n, v]) => `${esc(n)} ${RM(v)}`).join(" · ")}</p>` : ""}
      ${k.balance > 0 ? `<form class="add" data-form="cardpay" data-id="${c.id}" style="grid-template-columns:1fr auto"><input name="amount" type="number" inputmode="decimal" min="0" step="0.01" value="${k.balance.toFixed(2)}" aria-label="Jumlah bayaran"><button>Rekod bayaran kad</button></form>` : ""}
    </div>`).join("")}
    ${totUtil >= 30 ? `<p class="small muted">Tip: kekalkan penggunaan bawah 30% had dan bayar penuh setiap bulan untuk elak caj faedah.</p>` : ""}` : `<p class="empty">Belum ada kad. Tambah kad di bawah.</p>`}
    <details style="margin-top:12px"><summary>Tambah kad</summary>
    <form class="add" data-form="card">
      <label>Nama kad<input name="name" required placeholder="cth. Maybank Visa"></label>
      <label>Had kredit (RM)<input name="limit" type="number" inputmode="decimal" min="0" step="0.01" required></label>
      <label>Hari tarikh akhir bayar<input name="dueDay" type="number" min="1" max="31"></label>
      <label>Faedah setahun (%)<input name="rate" type="number" inputmode="decimal" min="0" step="0.01" value="15"></label>
      <label>Baki semasa (RM)<input name="opening" type="number" inputmode="decimal" min="0" step="0.01" value="0"></label>
      <button class="primary">Tambah kad</button>
    </form></details>
  </section>

  ${S.cards.length ? `<section class="card">
    <h2>Rekod penggunaan kad</h2>
    <form class="add" data-form="cardtx">
      <label>Kad<select name="cardId">${S.cards.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></label>
      <label>Tarikh<input name="date" type="date" value="${ymd(t)}" required></label>
      <label>Jumlah (RM)<input name="amount" type="number" inputmode="decimal" min="0" step="0.01" required></label>
      <label>Kategori<input name="cat" list="cardcats" required placeholder="cth. Minyak"></label>
      <label>Kedai / nota<input name="note"></label>
      <button class="primary">Rekod belanja</button>
    </form>
    <datalist id="cardcats">${CARD_CATS.map(x => `<option value="${x}">`).join("")}</datalist>
    <div class="row between" style="margin-top:14px">
      <select data-act="cardfilter" aria-label="Tapis kad" style="width:auto"><option value="">Semua kad</option>${S.cards.map(c => `<option value="${c.id}" ${c.id === cardFilter ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
      ${monthSelect("cardmonth", cardMonth, S.cardTx.map(t => t.date))}
    </div>
    <div class="grid2" style="margin-top:8px">${stat("Belanja " + (cardMonth ? fmtYM(cardMonth) : "semua bulan"), RM(mSpend), "neg")}${stat("Dibayar", RM(mPaid), "pos")}</div>
    ${rows.length ? `<ul class="list" style="margin-top:8px">${withMonthHeads(rows, !cardMonth, r => `<li><div class="grow"><div>${esc(r.cat)}${r.note ? ` <span class="muted small">· ${esc(r.note)}</span>` : ""}</div><div class="small muted">${fmtD(r.date)} · ${esc(cname(r.cardId))}</div>${r.type !== "bayar" ? `<div style="margin-top:4px">${payPill(allocAll[r.id])}</div>` : ""}</div>
      <span class="num ${r.type === "bayar" ? "pos" : r.type === "awal" ? "" : "neg"}">${r.type === "bayar" ? "−" : "+"}${RM(r.amount)}</span>${del("cardTx", r.id)}</li>`)}</ul>` : `<p class="empty">${cardMonth ? "Tiada rekod untuk " + fmtYM(cardMonth) : "Belum ada rekod"}.</p>`}
  </section>` : ""}`;
}

function vHutang() {
  const c = calc(S), t = today();
  const debts = [...S.debts].sort((a, b) => (Number(b.rate) || 0) - (Number(a.rate) || 0));
  return vKad() + `
  <section class="card">
    <div class="row between"><h2>Komitmen bulanan</h2>${dsrPill(c)}</div>
    ${S.commitments.length ? `<ul class="list">${S.commitments.map(x => `<li><div class="grow"><div>${esc(x.name)}</div><div class="small muted">Bayar setiap ${x.day || "—"} haribulan</div></div><span class="num">${RM(x.amount)}</span>${del("commitments", x.id)}</li>`).join("")}</ul>` : `<p class="empty">Tiada komitmen.</p>`}
    <form class="add" data-form="commitment">

// Rekod satu transaksi (dikongsi oleh borang Kewangan & butang pantas ＋).
function recordTx(d) {
  const amount = num(d.amount), cat = String(d.cat || "").trim() || (d.type === "in" ? "Masuk" : "Lain-lain"), note = String(d.note || "").trim();
  if (d.via && d.type === "out" && S.cards.some(c => c.id === d.via)) {
    S.cardTx.push({ id: uid(), cardId: d.via, date: d.date, type: "belanja", amount, cat, note });
    return "Direkod pada kad " + cardName(d.via) + " — belum bayar" + budgetWarn(cat, d.date);
  }
  S.tx.push({ id: uid(), date: d.date, type: d.type, cat, amount, note });
  return (d.type === "in" ? "Duit masuk " : "Duit keluar ") + RM(amount) + " direkod" + (d.type === "out" ? budgetWarn(cat, d.date) : "");
}
// Kategori untuk cip: kategori bajet + yang paling kerap digunakan (90 hari) + lalai.
function quickCats(type) {
  if (type === "in") return [...new Set([...S.tx.filter(t => t.type === "in").map(t => t.cat), "Gaji", "Sampingan", "Pasif", "Hadiah", "Lain-lain"].filter(Boolean).map(c => String(c).trim()))].slice(0, 8);
  const since = ymd(new Date(Date.now() - 90 * 864e5)), freq = {};
  for (const t of [...S.tx.filter(t => t.type === "out" && t.cat !== "Kad kredit"), ...S.cardTx.filter(t => t.type === "belanja")])
    if (String(t.date) >= since) { const k = String(t.cat || "").trim(); if (k) freq[k] = (freq[k] || 0) + 1; }
  const top = Object.entries(freq).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  const seen = new Set(), out = [];
  for (const c of [...S.budgets.map(b => b.cat), ...top, "Makan", "Minyak", "Barang dapur", "Bil", "Lain-lain"]) { const k = catKey(c); if (c && !seen.has(k)) { seen.add(k); out.push(String(c).trim()); } }
  return out.slice(0, 10);
}

  sh.innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-label="Rekod transaksi">
    <div class="grab"></div>
    <div class="seg"><button type="button" data-q="type" data-v="out" aria-pressed="${Q.type === "out"}">Duit keluar</button><button type="button" class="in" data-q="type" data-v="in" aria-pressed="${Q.type === "in"}">Duit masuk</button></div>
    <form id="quickForm">
      <input class="amt" name="qamt" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="RM 0.00" required value="${esc(amtVal)}" aria-label="Jumlah (RM)">
      <div class="small muted">Kategori</div>
      <div class="chips">${cats.map(c => `<button type="button" data-q="cat" data-v="${esc(c)}" aria-pressed="${!!Q.cat && catKey(c) === catKey(Q.cat)}">${esc(c)}</button>`).join("")}</div>
      <input name="qcat" list="cats" placeholder="atau taip kategori lain" value="${esc(Q.cat)}" aria-label="Kategori">
      ${Q.type === "out" && S.cards.length ? `<div class="small muted" style="margin-top:10px">Bayar guna</div>
      <div class="chips"><button type="button" data-q="via" data-v="" aria-pressed="${!Q.via}">Tunai / debit</button>${S.cards.map(c => `<button type="button" data-q="via" data-v="${c.id}" aria-pressed="${Q.via === c.id}">💳 ${esc(c.name)}</button>`).join("")}</div>` : ""}
      <div class="grid2" style="margin-top:10px">
        <label>Nota<input name="qnote" value="${esc(noteVal)}" placeholder="pilihan"></label>
        <label>Tarikh<input name="qdate" type="date" value="${Q.date}" required></label>
      </div>
      <div class="row" style="margin-top:14px"><button type="button" data-q="close" style="flex:1">Batal</button><button class="primary" style="flex:2">Simpan</button></div>
    </form>
  </div>`;
  sh.hidden = false;
}
document.addEventListener("click", e => {
  const sh = document.getElementById("sheet");
  if (!Q) return;
  if (e.target === sh) return closeQuick();
  const b = e.target.closest("[data-q]"); if (!b) return;
  const f = document.getElementById("quickForm");
  const keep = () => { Q.cat = f.qcat.value; Q.date = f.qdate.value; };
  if (b.dataset.q === "close") return closeQuick();
  keep();
  if (b.dataset.q === "type") { Q.type = b.dataset.v; Q.via = ""; }
  if (b.dataset.q === "cat") Q.cat = b.dataset.v;
  if (b.dataset.q === "via") Q.via = b.dataset.v;
  renderQuick();
});
document.addEventListener("submit", e => {
  if (e.target.id !== "quickForm") return;
  e.preventDefault(); e.stopImmediatePropagation();
  const f = e.target;
  const msg = recordTx({ type: Q.type, amount: f.qamt.value, cat: f.qcat.value, note: f.qnote.value, date: f.qdate.value, via: Q.type === "out" ? Q.via : "" });
  closeQuick(); commit(); toast(msg);
}, true);
document.addEventListener("keydown", e => { if (e.key === "Escape" && Q) closeQuick(); });

function render() {
  if (!VIEWS[tab]) tab = "ringkasan";
  document.getElementById("app").innerHTML = VIEWS[tab]();
  document.getElementById("nav").innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" ${k === tab || (k === "lagi" && UNDER_LAGI.includes(tab)) ? 'aria-current="page"' : ""}><i>${icon(k)}</i><span>${l}</span></button>`).join("");
}

/* ---------- peristiwa ---------- */
const num = v => Number(v) || 0;
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f));
  if (f.dataset.form === "setpw") {
    sb.auth.updateUser({ password: d.password }).then(({ error }) => {
      if (error) toast(/same|different/i.test(error.message) ? "Kata laluan ini sudah digunakan" : "Gagal: " + error.message);
      else { f.reset(); toast("Kata laluan disimpan. Guna e-mel + kata laluan ini di telefon lain."); }
    });
    return;
  }
  if (f.dataset.form === "invite") { invite(d.email); f.reset(); return; }
  if (f.dataset.form === "login") {
    const mode = (e.submitter && e.submitter.value) || "masuk";
    const btns = f.querySelectorAll("button"); btns.forEach(x => x.disabled = true);
    const cred = { email: d.email.trim().toLowerCase(), password: d.password };
    (mode === "daftar" ? sb.auth.signUp(cred) : sb.auth.signInWithPassword(cred))
      .then(({ data, error }) => {
        let msg = "";
        if (error) {
          const m = error.message || "";
          if (/invalid login credentials/i.test(m)) msg = "E-mel atau kata laluan salah. Jika telefon pertama dahulu log masuk guna <b>pautan e-mel</b>, akaun itu belum ada kata laluan — di telefon pertama buka Tetapan → <b>Tetapkan kata laluan</b>, kemudian cuba lagi di sini.";
          else if (/already registered|already exists/i.test(m)) msg = "Akaun ini sudah wujud — tekan <b>Log masuk</b> (bukan Daftar).";
          else if (/email not confirmed/i.test(m)) msg = "E-mel belum disahkan. Di Supabase → Authentication → Sign In / Providers → Email, matikan <b>Confirm email</b>, kemudian cuba lagi.";
          else if (/weak|password should|at least/i.test(m)) msg = "Kata laluan terlalu lemah — guna sekurang-kurangnya 6 aksara.";
          else if (/fetch|network/i.test(m)) msg = "Tiada sambungan internet ke Supabase. Semak internet dan cuba lagi.";
          else msg = "Gagal log masuk: " + esc(m);
        } else if (mode === "daftar" && !data.session) {
          msg = "Akaun dicipta tetapi perlu pengesahan e-mel. Matikan <b>Confirm email</b> di Supabase (Authentication → Sign In / Providers → Email), kemudian tekan Log masuk.";
        }
        loginErr = msg;
        const el = document.getElementById("loginErr");
        if (el) { el.innerHTML = msg; el.hidden = !msg; }
        if (!msg) toast("Berjaya log masuk");
      })
      .finally(() => f.isConnected && btns.forEach(x => x.disabled = false));
    return;
  }
  switch (f.dataset.form) {
    case "income": S.incomes.push({ id: uid(), name: d.name.trim(), type: d.type, amount: num(d.amount) }); break;
    case "tx": {
      const msg = recordTx(d);
      if (d.via || / · /.test(msg)) toast(msg);
      if (txMonth) txMonth = d.date.slice(0, 7);
      break;
    }
    case "deposit": {
      const kind = f.dataset.kind || d.kind;
      const out = d.dir === "out";
      const dep = { id: uid(), kind, dir: out ? "out" : "in", date: d.date, amount: num(d.amount), note: (d.note || "").trim() };
      if (kind === "emas") dep.grams = num(d.grams);
      S.deposits.push(dep);
      if (d.totx && !out && dep.amount > 0)
        S.tx.push({ id: uid(), date: dep.date, type: "out", cat: KIND_LABEL[kind], amount: dep.amount, note: dep.note || (kind === "emas" ? fmtG(dep.grams) : "Simpanan"), link: "dep:" + dep.id });
      toast(`${KIND_LABEL[kind]}: ${kind === "emas" ? (out ? "−" : "+") + fmtG(dep.grams) : (out ? "−" : "+") + RM(dep.amount)} direkod`);
      break;
    }
    case "gold": Object.assign(S.gold, { have: num(d.have), target: num(d.target), price: num(d.price), by: d.by || S.gold.by }); toast("Disimpan"); break;
    case "emergency":
      Object.assign(S.asb, { have: num(d.asbHave), s1: num(d.s1), s1by: d.s1by || S.asb.s1by });
      Object.assign(S.th, { have: num(d.thHave), target: num(d.thTarget), by: d.thBy || S.th.by });
      S.savings = num(d.savings); toast("Disimpan"); break;
    case "commitment": S.commitments.push({ id: uid(), name: d.name.trim(), amount: num(d.amount), day: num(d.day) }); break;
    case "debt": S.debts.push({ id: uid(), name: d.name.trim(), balance: num(d.balance), rate: num(d.rate), payment: num(d.payment), day: num(d.day) }); break;
    case "goal": S.goals.push({ id: uid(), year: num(d.year), area: d.area, title: d.title.trim(), done: false }); break;
    case "venture": S.ventures.push({ id: uid(), name: d.name.trim(), kind: d.kind.trim() || "Projek", target: num(d.target), stage: 0, steps: VENTURE_STEPS.map(t => ({ t, done: false })) }); break;
    case "step": { const v = S.ventures.find(x => x.id === f.dataset.id); if (v) v.steps.push({ t: d.t.trim(), done: false }); break; }
    case "card": {
      const card = { id: uid(), name: d.name.trim(), limit: num(d.limit), dueDay: num(d.dueDay), rate: num(d.rate) };
      S.cards.push(card);
      if (num(d.opening) > 0) S.cardTx.push({ id: uid(), cardId: card.id, date: ymd(today()), type: "awal", amount: num(d.opening), cat: "Baki awal", note: "" });
      break;
    }
    case "cardtx": S.cardTx.push({ id: uid(), cardId: d.cardId, date: d.date, type: "belanja", amount: num(d.amount), cat: d.cat.trim(), note: d.note.trim() }); if (cardMonth) cardMonth = d.date.slice(0, 7); toast("Belanja kad direkod" + budgetWarn(d.cat, d.date)); break;
    case "budget": {
      const cat = d.cat.trim(), ex = S.budgets.find(x => catKey(x.cat) === catKey(cat));
      if (ex) { ex.amount = num(d.amount); toast("Bajet " + ex.cat + " dikemas kini"); }
      else { S.budgets.push({ id: uid(), cat, amount: num(d.amount) }); toast("Bajet " + cat + " ditetapkan"); }
      break;
    }
    case "cardpay": {
      const card = S.cards.find(x => x.id === f.dataset.id); const amt = num(d.amount);
      if (card && amt > 0) {
        S.cardTx.push({ id: uid(), cardId: card.id, date: ymd(today()), type: "bayar", amount: amt, cat: "Bayaran", note: "" });
        S.tx.push({ id: uid(), date: ymd(today()), type: "out", cat: "Kad kredit", amount: amt, note: "Bayar " + card.name });
        toast("Bayaran kad direkod");
      }
      break;
    }
    case "settings": Object.assign(S.settings, { name: d.name.trim(), targetPassive: num(d.targetPassive), }); toast("Disimpan"); break;
  }
  commit();
});

document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]");
  if (tb) { tab = tb.dataset.tab; try { localStorage.setItem(KEY + ":tab", tab); } catch {} render(); window.scrollTo(0, 0);
    if (tb.dataset.goto) { const g = document.getElementById(tb.dataset.goto); if (g) g.scrollIntoView(); }
    return; }
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const { act, id } = b.dataset;
  switch (act) {
    case "del": if (confirm(b.dataset.list === "cards" ? "Padam kad ini dan semua rekod penggunaannya?" : "Padam item ini?")) {
      const list = b.dataset.list, now = Date.now();
      const linked = list === "deposits" ? S.tx.filter(t => t.link === "dep:" + id).map(t => t.id) : [];
      if (trashItem(S, list, id, now)) {
        linked.forEach(tid => trashItem(S, "tx", tid, now));
        commit();
        toastUndo(`${LIST_LABEL[list] || "Item"} dipadam${linked.length ? " (bersama transaksinya)" : ""}`, () => {
          const okR = restoreItem(S, id); linked.forEach(tid => restoreItem(S, "" + tid));
          if (okR) { commit(); toast("Dipulihkan"); }
        });
      }
    } break;
    case "pay": {
      S.paid[b.dataset.key] = true;
      const amt = num(b.dataset.amt);
      const kind = b.dataset.kind;
      S.tx.push({ id: uid(), date: ymd(today()), type: "out", cat: kind === "hutang" ? "Hutang" : kind === "kad" ? "Kad kredit" : "Komitmen", amount: amt, note: b.dataset.name, link: b.dataset.key });
      if (kind === "kad") S.cardTx.push({ id: uid(), cardId: id, date: ymd(today()), type: "bayar", amount: amt, cat: "Bayaran", note: "" });
      if (b.dataset.kind === "hutang") { const d = S.debts.find(x => x.id === id); if (d) d.balance = Math.max(0, num(d.balance) - amt); }
      toast("Direkod sebagai transaksi"); commit(); break;
    }
    case "goaltpl": {
      const have = new Set(S.goals.map(g => g.title));
      GOAL_TPL.forEach(([year, area, title]) => { if (!have.has(title)) S.goals.push({ id: uid(), year, area, title, done: false }); });
      toast("Templat ditambah"); commit(); break;
    }
    case "venturetpl": { const [name, kind, target] = VENTURE_TPL[num(b.dataset.i)]; S.ventures.push({ id: uid(), name, kind, target, stage: 0, steps: VENTURE_STEPS.map(t => ({ t, done: false })) }); commit(); break; }
    case "stage": { const v = S.ventures.find(x => x.id === id); if (v) { v.stage = Math.max(0, Math.min(4, v.stage + num(b.dataset.d))); commit(); } break; }
    case "delstep": {
      const key = "step-" + uid();
      if (trashStep(S, id, num(b.dataset.i), key, Date.now())) {
        commit();
        toastUndo("Langkah dipadam", () => { if (restoreItem(S, key)) { commit(); toast("Dipulihkan"); } });
      }
      break;
    }
    case "pdf": exportPDF(); break;
    case "emailtok": makeEmailToken(); break;
    case "emailcopy": copyEmailScript(); break;
    case "notifcopy": copyText(notifURL(), "Alamat disalin ✓ — tampal dalam MacroDroid (Permintaan HTTP → URL)"); break;
    case "notiftest": testNotif(); break;
    case "emailrevoke": if (confirm("Batalkan kod? Skrip Gmail yang sedia ada akan berhenti mencatat.")) revokeEmailToken(); break;
    case "quick": openQuick("out"); break;
    case "xlsx": exportExcel(false); break;
    case "xlsxall": exportExcel(true); break;
    case "budgetquick": if (!S.budgets.some(x => catKey(x.cat) === catKey(b.dataset.cat))) { S.budgets.push({ id: uid(), cat: b.dataset.cat, amount: num(b.dataset.amt) }); commit(); toast("Bajet " + b.dataset.cat + " ditetapkan " + RM(num(b.dataset.amt)) + " — ubah jika perlu"); } break;
    case "depall": depShowAll[b.dataset.key] = !depShowAll[b.dataset.key]; render(); break;
    case "restore1": if (restoreItem(S, id)) { commit(); toast("Dipulihkan"); } break;
    case "emptytrash": if (confirm("Kosongkan tong sampah? Item di dalamnya tidak boleh dipulihkan lagi.")) { S.trash = {}; commit(); } break;
    case "scanlost": scanLost(); break;
    case "restorelost": {
      const f = lostFound.find(x => String(x.item.id) === id);
      if (f && !S[f.list].some(x => x.id === f.item.id)) { S[f.list].push(f.item); lostFound = lostFound.filter(x => x !== f); commit(); toast("Dipulihkan: " + describeItem(f.list, f.item)); }
      break;
    }
    case "backup": {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `pelan2030-sandaran-${ymd(today())}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); break;
    }
    case "restore": document.getElementById("restoreFile").click(); break;
    case "sync": syncNow(); break;
    case "rmmember": if (confirm("Buang " + b.dataset.email + " daripada pelan ini?")) removeMember(b.dataset.email); break;
    case "leaveplan": if (confirm("Keluar dari pelan dikongsi? Anda akan guna salinan sendiri selepas ini.")) leavePlan(); break;
    case "notifyon": enableNotify(); break;
    case "notifyoff": S.settings.notify = false; commit(); toast("Notifikasi dimatikan"); break;
    case "testnotify": testNotify(); break;
    case "ics": downloadICS(); break;
    case "install": if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); } break;
    case "logout": sb.auth.signOut().then(() => { sbUser = null; plan = null; members = []; if (channel) { sb.removeChannel(channel); channel = null; } setSync(""); render(); toast("Telah log keluar. Data kekal dalam peranti ini."); }); break;
    case "wipe": if (confirm(sbUser ? "Padam SEMUA data, termasuk di awan (semua ahli pelan dikongsi akan terkesan)? Tindakan ini tidak boleh diundur." : "Padam SEMUA data? Tindakan ini tidak boleh diundur.") && confirm("Pasti? Muat turun sandaran dahulu jika perlu.")) { const snap = JSON.parse(JSON.stringify(S)); S = normalize(null); commit(); toastUndo("Semua data dipadam", () => { S = normalize(snap); commit(); toast("Semua data dipulihkan"); }); } break;
  }
});

document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "restoreFile" && el.files[0]) {
    el.files[0].text().then(txt => {
      const d = JSON.parse(txt);
      if (!confirm("Ganti data semasa dengan sandaran ini?")) return;
      S = normalize(d); commit(); toast("Sandaran dipulihkan");
    }).catch(() => toast("Fail sandaran tidak sah")).finally(() => { el.value = ""; });
    return;
  }
  const act = el.dataset.act; if (!act) return;
  if (act === "txmonth") { txMonth = el.value; render(); }
  if (act === "reportmonth" && el.value) { reportMonth = el.value; }
  if (act === "budgetmonth" && el.value) { budgetMonth = el.value; render(); }
  if (act === "budgetamt") { const x = S.budgets.find(y => y.id === el.dataset.id); if (x && num(el.value) >= 0) { x.amount = num(el.value); commit(); } }
  if (act === "sumyear") { sumYear = num(el.value); render(); }
  if (act === "trendsel") { trendSel = el.value; render(); }
  if (act === "cardmonth") { cardMonth = el.value; render(); }
  if (act === "notifydays") { S.settings.notifyDays = num(el.value); commit(); }
  if (act === "cardfilter") { cardFilter = el.value; render(); }
  if (act === "goaldone") { const g = S.goals.find(x => x.id === el.dataset.id); if (g) { g.done = el.checked; commit(); } }
  if (act === "step") { const v = S.ventures.find(x => x.id === el.dataset.id); if (v) { v.steps[num(el.dataset.i)].done = el.checked; commit(); } }
  if (act === "debtbal") { const d = S.debts.find(x => x.id === el.dataset.id); if (d) { d.balance = num(el.value); commit(); } }
});

window.addEventListener("storage", e => { if (e.key === KEY) { S = load(); render(); } });
render();
initCloud();
{ const q = new URLSearchParams(location.search).get("tambah");
  if (q === "keluar" || q === "masuk") { openQuick(q === "masuk" ? "in" : "out"); history.replaceState(null, "", location.pathname); } }
syncReminders();
if (S.settings.notify) registerPeriodic();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
