<style>
:root{
  --paper:#ECF0ED; --card:#FFFFFF; --ink:#17263A; --muted:#5A6676; --line:#D3DAD5;
  --red:#7A1F2B; --teal:#2C6B66; --amber:#A86A12; --gold:#B8892B;
  --ok:#2C6B66; --warn:#A86A12; --bad:#7A1F2B;
  --radius:14px; --shadow:0 1px 2px rgba(23,38,58,.06),0 4px 14px rgba(23,38,58,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1722; --card:#18222F; --ink:#E7ECEA; --muted:#9AA6B4; --line:#2A3646;
    --red:#C9566A; --teal:#5AB0A8; --amber:#D9A04A; --gold:#D8B060;
    --ok:#5AB0A8; --warn:#D9A04A; --bad:#E07386; color-scheme:dark;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1722; --card:#18222F; --ink:#E7ECEA; --muted:#9AA6B4; --line:#2A3646;
  --red:#C9566A; --teal:#5AB0A8; --amber:#D9A04A; --gold:#D8B060;
  --ok:#5AB0A8; --warn:#D9A04A; --bad:#E07386; color-scheme:dark; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.15;margin:0 0 .5rem}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1rem}
main{max-width:760px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.bar{height:10px;background:var(--paper);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:99px}

ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}

ul.list .grow{flex:1;min-width:0}

form.add{display:grid;gap:8px;margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px}
button.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
button.sm{padding:5px 10px;font-size:.85rem}
button.danger{color:var(--bad);border-color:currentColor;background:transparent}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--teal)}
/* hero passport stamp */
.hero{position:relative;overflow:hidden;background:var(--red);color:#fff;border:0}
.hero .muted{color:rgba(255,255,255,.75)}
.stamps{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.stamp{border:2px dashed rgba(255,255,255,.7);border-radius:8px;padding:4px 8px;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;transform:rotate(-4deg);opacity:.65}
.stamp.now{opacity:1;background:rgba(255,255,255,.14);transform:rotate(-2deg)}
.stamp.past{opacity:.9;text-decoration:line-through}
.big{font-family:"Bricolage Grotesque",sans-serif;font-size:2.4rem;font-weight:700;line-height:1}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:10}
nav.tabs button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;font-size:.7rem;padding:6px 2px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--red);font-weight:600}
.empty{color:var(--muted);font-size:.9rem;padding:6px 0}
.stages{display:flex;gap:4px;margin:8px 0}
.stages span{flex:1;font-size:.68rem;text-align:center;padding:4px 2px;border-radius:6px;background:var(--paper);color:var(--muted)}
.stages span.on{background:var(--teal);color:#fff}
details summary{cursor:pointer;font-weight:600}
svg.chart text{fill:var(--muted);font-size:10px;font-family:"IBM Plex Sans",sans-serif}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:10px;font-size:.9rem;z-index:20}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .4s ease}}

<script>
// @logic-start — fungsi tulen (diuji dalam tests/calc.test.mjs)
const DEFAULTS = () => ({
  v: 2,
  updatedAt: 0,
  settings: { name: "", targetPassive: 3000, emergencyMonths: 6 },
  savings: 0,
  incomes: [], commitments: [], debts: [], tx: [], goals: [], ventures: [],
  paid: {},
  gold: { have: 0, target: 30, price: 0, by: "2028-12" },
  asb: { have: 0, s1: 15000, s2: 30000, s1by: "2027-12", s2by: "2030-12" }
});

function normalize(d) {
  const b = DEFAULTS();
  if (!d || typeof d !== "object") return b;
  const o = Object.assign({}, b, d);
  o.settings = Object.assign({}, b.settings, d.settings || {});
  o.gold = Object.assign({}, b.gold, d.gold || {});
  o.asb = Object.assign({}, b.asb, d.asb || {});
  for (const k of ["incomes", "commitments", "debts", "tx", "goals", "ventures"]) {
    if (!Array.isArray(o[k])) o[k] = [];
  }
  if (!o.paid || typeof o.paid !== "object") o.paid = {};
  o.savings = Number(o.savings) || 0;
  o.v = Math.max(1, Number(o.v) || 1);
  // v1 → v2: tambah cap masa `updatedAt` untuk penyegerakan awan.
  if (o.v < 2) { o.updatedAt = Number(o.updatedAt) || 0; o.v = 2; }
  o.updatedAt = Number(o.updatedAt) || 0;
  return o;
}

const sum = (arr, f) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);

function calc(S) {
  const income = sum(S.incomes, x => x.amount);
  const commit = sum(S.commitments, x => x.amount);
  const debtPay = sum(S.debts, x => x.payment);
  const out = commit + debtPay;
  const balance = income - out;
  const dsr = income > 0 ? (out / income) * 100 : (out > 0 ? Infinity : 0);
  const dsrLevel = dsr < 40 ? "sihat" : dsr <= 60 ? "berhati-hati" : "tinggi";
  const mix = { aktif: 0, sampingan: 0, pasif: 0 };
  for (const i of S.incomes) if (i.type in mix) mix[i.type] += Number(i.amount) || 0;
  const target = Number(S.settings.targetPassive) || 0;
  const passivePct = target > 0 ? Math.min(100, (mix.pasif / target) * 100) : 0;
  const totalDebt = sum(S.debts, x => x.balance);
  const emergencyTarget = out * (Number(S.settings.emergencyMonths) || 0);
  const emergencyPct = emergencyTarget > 0 ? Math.min(100, (S.savings / emergencyTarget) * 100) : 0;
  return { income, commit, debtPay, out, balance, dsr, dsrLevel, mix, passivePct, totalDebt, emergencyTarget, emergencyPct };
}

// Bilangan bulan untuk selesaikan hutang (faedah tahunan % dikompaun bulanan).
function monthsToPay(balance, ratePct, payment) {
  balance = Number(balance) || 0; payment = Number(payment) || 0;
  if (balance <= 0) return 0;
  if (payment <= 0) return Infinity;
  const r = (Number(ratePct) || 0) / 100 / 12;
  if (r === 0) return Math.ceil(balance / payment);
  if (payment <= balance * r) return Infinity;
  return Math.ceil(-Math.log(1 - (r * balance) / payment) / Math.log(1 + r));
}

const ym = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
const ymd = d => ym(d) + "-" + String(d.getDate()).padStart(2, "0");
const dim = (y, m) => new Date(y, m + 1, 0).getDate();

function addMonths(date, n) {
  const d = new Date(date.getFullYear(), date.getMonth() + n, 1);
  d.setDate(Math.min(date.getDate(), dim(d.getFullYear(), d.getMonth())));
  return d;
}

// Peringatan bayaran: tertunggak bulan ini + akan datang dalam `days` hari.
function upcoming(S, today, days = 14) {
  const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const items = [
    ...S.commitments.map(c => ({ id: c.id, name: c.name, amount: Number(c.amount) || 0, day: Number(c.day), kind: "komitmen" })),
    ...S.debts.filter(d => (Number(d.balance) || 0) > 0).map(d => ({ id: d.id, name: d.name, amount: Number(d.payment) || 0, day: Number(d.day), kind: "hutang" }))
  ].filter(i => i.day >= 1 && i.day <= 31);
  const res = [];
  for (const it of items) {
    for (const off of [0, 1]) {
      const base = new Date(t0.getFullYear(), t0.getMonth() + off, 1);
      const due = new Date(base.getFullYear(), base.getMonth(), Math.min(it.day, dim(base.getFullYear(), base.getMonth())));
      const key = it.id + ":" + ym(due);
      if (S.paid[key]) continue;
      const diff = Math.round((due - t0) / 86400000);
      if ((off === 0 && diff < 0) || (diff >= 0 && diff <= days)) {
        res.push({ ...it, due: ymd(due), key, diff });
      }
    }
  }
  return res.sort((a, b) => a.diff - b.diff);
}

// Kiraan simpanan bulanan untuk capai sasaran pada "YYYY-MM".
function savCalc(have, target, by, today) {
  have = Number(have) || 0; target = Number(target) || 0;
  const need = Math.max(0, target - have);
  const pct = target > 0 ? Math.min(100, (have / target) * 100) : 0;
  let months = 0;
  if (by && /^\d{4}-\d{2}$/.test(by)) {
    const [y, m] = by.split("-").map(Number);
    months = (y - today.getFullYear()) * 12 + (m - 1 - today.getMonth()) + 1;
  }
  months = Math.max(0, months);
  const perMonth = need === 0 ? 0 : months > 0 ? need / months : Infinity;
  return { need, pct, months, perMonth };
}

// Aliran masuk/keluar ikut bulan untuk n bulan terakhir.
function trend(tx, today, n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const k = ym(addMonths(new Date(today.getFullYear(), today.getMonth(), 1), -i));
    const rows = tx.filter(t => String(t.date).slice(0, 7) === k);
    out.push({ m: k, in: sum(rows.filter(t => t.type === "in"), t => t.amount), out: sum(rows.filter(t => t.type === "out"), t => t.amount) });
  }
  return out;
}
// @logic-end
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
"use strict";
const KEY = "pelan2030";
const END = new Date(2030, 11, 31);
const STAGES = ["Idea", "Validasi", "Bina", "Lancar", "Skala"];
const MIXC = { aktif: "var(--ink)", sampingan: "var(--amber)", pasif: "var(--teal)" };
const fmtRM = new Intl.NumberFormat("ms-MY", { style: "currency", currency: "MYR", maximumFractionDigits: 0 });
const RM = n => isFinite(n) ? fmtRM.format(Math.round(n)).replace("MYR", "RM") : "—";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const BULAN = ["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogo","Sep","Okt","Nov","Dis"];
const fmtYM = k => { const [y, m] = k.split("-"); return BULAN[+m - 1] + " " + y; };
const fmtD = s => { const [y, m, d] = s.split("-"); return +d + " " + BULAN[+m - 1] + " " + y; };
const today = () => new Date();

let S = load();
let tab = (() => { try { return localStorage.getItem(KEY + ":tab") || "ringkasan"; } catch { return "ringkasan"; } })();
let txMonth = ym(today());
let trendN = 6;

function load() {
  try { return normalize(JSON.parse(localStorage.getItem(KEY))); } catch { return normalize(null); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { toast("Gagal simpan — storan pelayar penuh atau disekat"); }
}
function commit() { S.updatedAt = Date.now(); save(); queuePush(); render(); }

/* ---------- penyegerakan awan (Supabase) ---------- */
const CFG = window.PELAN_CONFIG || {};
const cloudConfigured = !!(CFG.supabaseUrl && CFG.supabaseKey);
let sb = null, sbUser = null, syncMsg = "", pushT = null;
function setSync(msg) {
  syncMsg = msg;
  const el = document.getElementById("syncMsg");
  if (el) el.textContent = msg;
}
function queuePush() {
  if (!sbUser) return;
  clearTimeout(pushT);
  pushT = setTimeout(pushCloud, 1200);
}
async function pushCloud() {
  if (!sbUser) return;
  setSync("Menyegerak…");
  const { error } = await sb.from("plans").upsert({ user_id: sbUser.id, data: S, updated_at: new Date(S.updatedAt || Date.now()).toISOString() });
  setSync(error ? "Gagal segerak: " + error.message : "Disegerak " + new Date().toLocaleTimeString("ms-MY"));
}
async function pullCloud() {
  if (!sbUser) return;
  setSync("Menyemak awan…");
  const { data, error } = await sb.from("plans").select("data").eq("user_id", sbUser.id).maybeSingle();
  if (error) { setSync("Gagal baca awan: " + error.message); return; }
  const remote = data && data.data;
  if (remote && (Number(remote.updatedAt) || 0) > (S.updatedAt || 0)) {
    S = normalize(remote); save(); render();
    setSync("Data terkini dimuatkan dari awan " + new Date().toLocaleTimeString("ms-MY"));
  } else if (!remote || (S.updatedAt || 0) > (Number(remote.updatedAt) || 0)) {
    await pushCloud();
  } else {
    setSync("Sudah terkini " + new Date().toLocaleTimeString("ms-MY"));
  }
}
function initCloud() {
  if (!cloudConfigured || !window.supabase) return;
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);
  sb.auth.onAuthStateChange((_ev, session) => {
    const u = session ? session.user : null;
    const changed = (u && u.id) !== (sbUser && sbUser.id);
    sbUser = u;
    if (changed) { render(); if (u) setTimeout(pullCloud, 0); }
  });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && sbUser) pullCloud(); });
}
function toast(msg) {
  const el = document.createElement("div"); el.className = "toast"; el.role = "status"; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2200);
}

/* ---------- ikon ---------- */
const I = {
  ringkasan: '<path d="M3 12l9-8 9 8M5 10v10h14V10"/>',
  kewangan: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>',
  hutang: '<path d="M12 3v18M17 7H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>',
  pelan: '<rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M4 10h16"/>',
  niaga: '<path d="M4 20V10l8-6 8 6v10M9 20v-6h6v6"/>',
  tetapan: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>'
};
const TABS = [["ringkasan","Ringkasan"],["kewangan","Kewangan"],["hutang","Hutang"],["pelan","Pelan 2030"],["niaga","Niaga"],["tetapan","Tetapan"]];
const icon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`;

/* ---------- komponen ---------- */
const bar = (pct, cls = "") => `<div class="bar ${cls}" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></div>`;
const stat = (label, val, cls = "") => `<div class="stat"><span>${label}</span><b class="${cls}">${val}</b></div>`;
const del = (list, id) => `<button class="ghost sm" data-act="del" data-list="${list}" data-id="${id}" aria-label="Padam">✕</button>`;
const dsrPill = c => `<span class="pill ${c.dsrLevel === "sihat" ? "ok" : c.dsrLevel === "tinggi" ? "bad" : "warn"}">DSR ${isFinite(c.dsr) ? c.dsr.toFixed(0) + "%" : "—"} · ${c.dsrLevel}</span>`;

function chart(data) {
  const W = 320, H = 140, P = 22, max = Math.max(1, ...data.flatMap(d => [d.in, d.out]));
  const bw = (W - P) / data.length;
  const bars = data.map((d, i) => {
    const x = P + i * bw, hi = (d.in / max) * (H - 30), ho = (d.out / max) * (H - 30);
    return `<rect x="${x + bw * .12}" y="${H - 18 - hi}" width="${bw * .36}" height="${hi}" rx="2" fill="var(--teal)"><title>${fmtYM(d.m)} masuk ${RM(d.in)}</title></rect>
      <rect x="${x + bw * .52}" y="${H - 18 - ho}" width="${bw * .36}" height="${ho}" rx="2" fill="var(--red)"><title>${fmtYM(d.m)} keluar ${RM(d.out)}</title></rect>
      <text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle">${BULAN[+d.m.slice(5) - 1]}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Graf aliran tunai">
    <line x1="${P}" x2="${W}" y1="${H - 18}" y2="${H - 18}" stroke="var(--line)"/>
    <text x="0" y="12">${RM(max)}</text>${bars}</svg>
    <div class="row small muted"><span><span style="color:var(--teal)">■</span> Masuk</span><span><span style="color:var(--red)">■</span> Keluar</span></div>`;
}

function nextSteps(c) {
  const s = [];
  if (!S.incomes.length) s.push("Tambah sumber pendapatan di tab Kewangan.");
  if (!S.commitments.length && !S.debts.length) s.push("Senaraikan komitmen dan hutang anda.");
  if (c.dsr >= 40 && isFinite(c.dsr)) s.push("DSR melebihi 40% — fokus bayar hutang faedah tertinggi dahulu.");
  if (c.emergencyPct < 100 && c.out > 0) s.push(`Bina dana kecemasan: ${RM(c.emergencyTarget - S.savings)} lagi.`);
  if (!S.goals.length) s.push("Isi matlamat tahunan di tab Pelan 2030 (guna templat).");
  const g = S.goals.filter(x => !x.done).sort((a, b) => a.year - b.year)[0];
  if (g) s.push(`Matlamat ${g.year}: ${g.title}`);
  const v = S.ventures.find(x => x.steps.some(st => !st.done));
  if (v) s.push(`${v.name}: ${v.steps.find(st => !st.done).t}`);
  if (c.mix.pasif < (S.settings.targetPassive || 0)) s.push("Teruskan bina pendapatan pasif hingga capai sasaran.");
  return s.slice(0, 5);
}

  <section class="card">
    <h2>Zon bahaya</h2>
    <button class="danger" data-act="wipe">Padam semua data</button>
  </section>
  <p class="small muted" style="text-align:center">Pelan 2030 · skema v${S.v}</p>`;
}

const VIEWS = { ringkasan: vRingkasan, kewangan: vKewangan, hutang: vHutang, pelan: vPelan, niaga: vNiaga, tetapan: vTetapan };

function render() {
  if (!VIEWS[tab]) tab = "ringkasan";
  document.getElementById("app").innerHTML = VIEWS[tab]();
  document.getElementById("nav").innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" ${k === tab ? 'aria-current="page"' : ""}>${icon(k)}<span>${l}</span></button>`).join("");
}

/* ---------- peristiwa ---------- */
const num = v => Number(v) || 0;
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f));
  if (f.dataset.form === "login") {
    const btn = f.querySelector("button"); btn.disabled = true;
    sb.auth.signInWithOtp({ email: d.email.trim(), options: { emailRedirectTo: location.origin + location.pathname } })
      .then(({ error }) => toast(error ? "Gagal: " + error.message : "Semak e-mel anda untuk pautan log masuk"))
      .finally(() => { btn.disabled = false; });
    return;
  }
  switch (f.dataset.form) {
    case "income": S.incomes.push({ id: uid(), name: d.name.trim(), type: d.type, amount: num(d.amount) }); break;
    case "tx": S.tx.push({ id: uid(), date: d.date, type: d.type, cat: d.cat.trim(), amount: num(d.amount), note: d.note.trim() }); txMonth = d.date.slice(0, 7); break;
    case "gold": Object.assign(S.gold, { have: num(d.have), target: num(d.target), price: num(d.price), by: d.by || S.gold.by }); toast("Disimpan"); break;
    case "asb": Object.assign(S.asb, { have: num(d.have), s1: num(d.s1), s2: num(d.s2), s1by: d.s1by || S.asb.s1by, s2by: d.s2by || S.asb.s2by }); toast("Disimpan"); break;
    case "savings": S.savings = num(d.savings); toast("Disimpan"); break;
    case "commitment": S.commitments.push({ id: uid(), name: d.name.trim(), amount: num(d.amount), day: num(d.day) }); break;
    case "debt": S.debts.push({ id: uid(), name: d.name.trim(), balance: num(d.balance), rate: num(d.rate), payment: num(d.payment), day: num(d.day) }); break;
    case "goal": S.goals.push({ id: uid(), year: num(d.year), area: d.area, title: d.title.trim(), done: false }); break;
    case "venture": S.ventures.push({ id: uid(), name: d.name.trim(), kind: d.kind.trim() || "Projek", target: num(d.target), stage: 0, steps: VENTURE_STEPS.map(t => ({ t, done: false })) }); break;
    case "step": { const v = S.ventures.find(x => x.id === f.dataset.id); if (v) v.steps.push({ t: d.t.trim(), done: false }); break; }
    case "settings": Object.assign(S.settings, { name: d.name.trim(), targetPassive: num(d.targetPassive), emergencyMonths: num(d.emergencyMonths) }); toast("Disimpan"); break;
  }
  commit();
});

document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]");
  if (tb) { tab = tb.dataset.tab; try { localStorage.setItem(KEY + ":tab", tab); } catch {} render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const { act, id } = b.dataset;
  switch (act) {
    case "del": if (confirm("Padam item ini?")) { S[b.dataset.list] = S[b.dataset.list].filter(x => x.id !== id); commit(); } break;
    case "pay": {
      S.paid[b.dataset.key] = true;
      const amt = num(b.dataset.amt);
      S.tx.push({ id: uid(), date: ymd(today()), type: "out", cat: b.dataset.kind === "hutang" ? "Hutang" : "Komitmen", amount: amt, note: b.dataset.name, link: b.dataset.key });
      if (b.dataset.kind === "hutang") { const d = S.debts.find(x => x.id === id); if (d) d.balance = Math.max(0, num(d.balance) - amt); }
      toast("Direkod sebagai transaksi"); commit(); break;
    }
    case "trend": trendN = num(b.dataset.n); render(); break;
    case "goaltpl": {
      const have = new Set(S.goals.map(g => g.title));
      GOAL_TPL.forEach(([year, area, title]) => { if (!have.has(title)) S.goals.push({ id: uid(), year, area, title, done: false }); });
      toast("Templat ditambah"); commit(); break;
    }
    case "venturetpl": { const [name, kind, target] = VENTURE_TPL[num(b.dataset.i)]; S.ventures.push({ id: uid(), name, kind, target, stage: 0, steps: VENTURE_STEPS.map(t => ({ t, done: false })) }); commit(); break; }
    case "stage": { const v = S.ventures.find(x => x.id === id); if (v) { v.stage = Math.max(0, Math.min(4, v.stage + num(b.dataset.d))); commit(); } break; }
    case "delstep": { const v = S.ventures.find(x => x.id === id); if (v) { v.steps.splice(num(b.dataset.i), 1); commit(); } break; }
    case "backup": {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `pelan2030-sandaran-${ymd(today())}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); break;
    }
    case "restore": document.getElementById("restoreFile").click(); break;
    case "sync": pullCloud(); break;
    case "logout": sb.auth.signOut().then(() => { sbUser = null; setSync(""); render(); toast("Telah log keluar. Data kekal dalam peranti ini."); }); break;
    case "wipe": if (confirm(sbUser ? "Padam SEMUA data, termasuk salinan di awan? Tindakan ini tidak boleh diundur." : "Padam SEMUA data? Tindakan ini tidak boleh diundur.") && confirm("Pasti? Muat turun sandaran dahulu jika perlu.")) { S = normalize(null); commit(); toast("Semua data dipadam"); } break;
  }
});

document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "restoreFile" && el.files[0]) {
    el.files[0].text().then(txt => {
      const d = JSON.parse(txt);
      if (!confirm("Ganti data semasa dengan sandaran ini?")) return;
      S = normalize(d); commit(); toast("Sandaran dipulihkan");
    }).catch(() => toast("Fail sandaran tidak sah")).finally(() => { el.value = ""; });
    return;
  }
  const act = el.dataset.act; if (!act) return;
  if (act === "txmonth" && el.value) { txMonth = el.value; render(); }
  if (act === "goaldone") { const g = S.goals.find(x => x.id === el.dataset.id); if (g) { g.done = el.checked; commit(); } }
  if (act === "step") { const v = S.ventures.find(x => x.id === el.dataset.id); if (v) { v.steps[num(el.dataset.i)].done = el.checked; commit(); } }
  if (act === "debtbal") { const d = S.debts.find(x => x.id === el.dataset.id); if (d) { d.balance = num(el.value); commit(); } }
});

window.addEventListener("storage", e => { if (e.key === KEY) { S = load(); render(); } });
render();
initCloud();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
